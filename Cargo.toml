# MELDWORLD server workspace (BUILD-PLAN.md §1 repo layout).
#
# This is the today-slice of the canonical layout: the crates needed to prove
# "4 players join a server and kill one creature" over the real stack. The
# Bevy client crates (client/crates/meld-client, meld-ui) and the remaining
# economy/meta/endgame services are the next slices and are not members yet.
[workspace]
resolver = "2"
members = [
    "shared/meld-proto",
    "server/crates/meld-balance",
    "server/crates/meld-db",
    "server/crates/meld-api",
    "server/crates/meld-battle",
    "server/crates/meld-dungeon",
    "server/crates/meld-dungeon-content",
    "server/crates/meld-dungeon-run",
    "server/crates/meld-dungeon-viz",
    "server/crates/meld-world",
    "server/crates/meld-run",
    "server/crates/meld-server",
    "qa",
    "mcp",
]
# The Bevy client is its own workspace (BUILD-PLAN §1 M0.1/M0.3: server and
# client workspaces are separate, sharing only the meld-proto crate by path).
exclude = ["client"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# internal crates
meld-proto = { path = "shared/meld-proto" }
meld-balance = { path = "server/crates/meld-balance" }
meld-db = { path = "server/crates/meld-db" }
meld-api = { path = "server/crates/meld-api" }
meld-battle = { path = "server/crates/meld-battle" }
meld-world = { path = "server/crates/meld-world" }
meld-run = { path = "server/crates/meld-run" }

[profile.dev]
# The ATB engine + bots do a lot of tiny allocations; opt-level 1 keeps the
# test loop snappy without a full release build.
opt-level = 1

# WORLDGEN IS THE WHOLE COST OF `make check`, so it gets compiled properly for tests.
#
# Measured: of a ~500s check, `meld-world`'s test binary was 439s and everything else
# combined was under 40s. It is not the test COUNT — it is that world generation is
# compute-bound pure code (splitmix64 streams, rejection-sampling thousands of props per
# section, property tests sweeping hundreds of seeds through a full `Arena::generate`) and
# `[profile.test]` inherits dev's opt-level 1.
#
# Optimising it buys the time back without giving up a single seed of coverage — those sweeps
# are what make extraction feasible BY CONSTRUCTION, so thinning them to go faster would be
# selling the guarantee. `debug-assertions` and overflow checks are separate settings and stay
# ON, so nothing about what the tests catch changes; only the codegen does.
[profile.test.package.meld-world]
opt-level = 3
[profile.test.package.meld-battle]
opt-level = 3

[workspace.dependencies.meld-server]
path = "server/crates/meld-server"
