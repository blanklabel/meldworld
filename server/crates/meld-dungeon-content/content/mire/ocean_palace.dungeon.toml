[trap.T1]
kind = "thorns"
disarmable = true

# Section One: NW + NE levers reveal the south room; its lever opens the hall door.
[gate.G1]
when = "all[L1,L2]"

[door.D1]
when = "L3"

# Section Three: both side switches AND the central switch open the sanctum gate.
[gate.G2]
when = "all[L4,L5,L6]"

[boss.B1]
sprite = "twingolem"
on_enter_spawn = true

# Treasures A–H: the Ocean Palace weapon/armour hoard (rolled at the stamped depth).
[chest.A]
loot = "rolled"
[chest.B]
loot = "rolled"
[chest.C]
loot = "rolled"
[chest.D]
loot = "rolled"
[chest.E]
loot = "rolled"
[chest.F]
loot = "rolled"
[chest.G]
loot = "rolled"
[chest.H]
loot = "rolled"

# The Elixir vault — sealed until the Twin Golems fall.
[chest.I]
when = "boss_dead(B1)"
loot = "rolled"
