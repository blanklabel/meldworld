# Ocean Palace — a hand-authored MIRE dungeon recreating Chrono Trigger's Ocean
# Palace layout (structure, not a pixel-copy) across four floors:
#   Floor 0  Section One — the sunken hall (switch-gated central chamber, treasures)
#   Floor 1  the lower vaults (four treasures)
#   Floor 2  Section Two — the winding descent
#   Floor 3  Section Three — the sanctum: the Twin Golems + the Elixir vault
# Renders via the DG-6b re-skin as a dim, mossy mire.

name  = "ocean_palace"
biome = "mire"

[legend]
a = "lever L1"
b = "lever L2"
c = "lever L3"
d = "lever L4"
f = "lever L5"
g = "lever L6"
X = "door D1"
Y = "gate G1"
Z = "gate G2"
p = "trap T1"
s = "stair S1 down"
w = "stair S1 up"
t = "stair S2 down"
u = "stair S2 up"
m = "stair S3 down"
n = "stair S3 up"
A = "chest A"
B = "chest B"
C = "chest C"
D = "chest D"
E = "chest E"
F = "chest F"
G = "chest G"
H = "chest H"
I = "chest I"
Q = "boss B1"

