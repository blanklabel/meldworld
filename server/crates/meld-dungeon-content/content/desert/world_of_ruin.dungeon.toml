# The World of Ruin — a LARGE hand-authored DESERT dungeon (~20 min), recreating
# Final Fantasy VI's World of Ruin as an archipelago of mesa "islands" marooned in
# impassable canyon/quicksand. Six of the location-islands are guarded by DRAGONS
# (mandatory fights) each holding a switch; throwing all six opens the bridge to
# KEFKA'S TOWER — a three-boss gauntlet behind boss-gated doors ending at Kefka, the
# vault, and the exit. Nine mandatory boss fights + ~13 treasures. DG-6b desert re-skin.

name  = "world_of_ruin"
biome = "desert"

[legend]
a = "lever L1"
b = "lever L2"
c = "lever L3"
d = "lever L4"
f = "lever L5"
