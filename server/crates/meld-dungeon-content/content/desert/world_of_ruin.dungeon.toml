# All six dragon-switches open the tower bridge.
[gate.G1]
when = "all[L1,L2,L3,L4,L5,L6]"

# The tower gauntlet: each guardian's fall opens the next door.
[door.D1]
when = "boss_dead(B7)"
[door.D2]
when = "boss_dead(B8)"

# Six dragons (ring) + two tower guardians + Kefka.
