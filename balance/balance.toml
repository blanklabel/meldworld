explorer_safe_passage_evasion = 0.22   # dodge chance added to EVERY ally
# A World Known (Globemaster, L17): fill every living ally's ATB gauge by this much.
# A WORLD KNOWN is a real HASTE, not a one-off nudge: for its window every ally's gauge
# fills faster, which is the top of the tempo ladder the class is built on. (It used to add
# a flat +0.5 gauge once, which is the same shape as the L49 capstone below and made the
# two rungs read as one idea twice.) [TUNABLE]
explorer_haste_mult = 1.6        # gauge fill rate multiplier while hastened
explorer_haste_ticks = 100       # ~10s at the 100ms tick
# NOW: the Globemaster's once-per-battle call. Every ally acts immediately — not faster,
