# MELDWORLD tunable constants (CANON.md §B / §D). Owned by T1.
#
# Working agreement #2: NO gameplay number appears as a literal in any crate.
# Formula *structure* is code; formula *coefficients* live here. Only the subset
# the today-slice actually reads is present; more land as their systems do.

[session]
heartbeat_interval_ms = 5000     # CANON D-session; realtime-protocol session.md
grace_window_ms = 10000          # CANON §B disconnect grace
auth_timeout_ms = 5000           # first message must be session.authenticate
realtime_ticket_ttl_ms = 60000   # auth-players.md: ticket expires 60s after issue

[auth]
bcrypt_cost = 12                 # CANON D17
session_token_ttl_secs = 86400   # 24h

[world]
chunk_size = 64                  # CANON §G Chunk (64x64)
interest_radius_chunks = 2       # CANON §B networking
overworld_sim_hz = 20            # CANON §B
snapshot_hz = 10                 # CANON §B
touch_radius_tiles = 1.0         # contact distance to trigger a battle (spec-defined)
interaction_radius_tiles = 2.5   # range to use a portal/drop/etc. (~2-tile, limits.md) [TUNABLE]
avatar_speed_tiles_per_sec = 6.0 # overworld walk speed (spec-defined)
battle_reentry_grace_ms = 5000   # after winning/losing/fleeing a fight, how long that
                                  # player is immune to being touched into a new one —
                                  # covers the victory/loot summary and gives a fled
                                  # player a real window to walk away [TUNABLE]

[runs]
# base_run_level(hub) = round(1 + hub.distance * base_run_level_per_distance)
base_run_level_per_distance = 0.078   # CANON §B -> Center=1, D500=40

# How an encounter's creatures scale with the SIZE of the party facing them, on top
# of the distance curve. Indexed by party size (1..4).
#
# Applied to creature HEALTH only — never to attack. A pack facing four heroes needs
# to LAST longer, but it does not swing four times harder at each of them; scaling
# attack made a larger party strictly more lethal per head and wiped level-1 parties
# at distance 0.
#
# Why superlinear rather than flat: four heroes bring roughly four times the damage,
# so creatures that only doubled would make a full party's fights SHORTER than a solo
# hero's. The intended arc is the opposite — a new player soloing does quick, easy
# fights (the tutorial era), and by the time they field four the fights are long
# affairs. Party slots unlock at 1 hero L10 / 2 at L20 / 3 at L30, so this ramp is
# indexed to the same progression the player actually feels. [TUNABLE]
encounter_party_scale = [1.0, 1.9, 3.0, 4.4]

# Encounter XP is SPLIT across the party rather than paid to each hero in full: a
# lone hero absorbs the whole lesson, four share it. This is what makes the early
# solo era level fast and the late four-hero era long, using the same encounters.
xp_split_across_party = true
# Two containers, and only one of them has a limit. The **Party Inventory** is
# UNBOUNDED — a slot cap there punishes finding things, which is the opposite of what
# loot is for. Each hero's **pouch** is capped, because a pouch is the only thing a
# hero can reach mid-fight: the cap is what turns "who is carrying the heals" into a
# decision you make on the overworld. Same-kind stacks merge and cost no slot, so the
# cap counts KINDS a hero carries, not quantity. [TUNABLE]
hero_pouch_slots = 10
# Extraction channel duration. Spec default is 10000 (10s, interruptible);
# shortened here for snappy runs/tests. [TUNABLE]
extraction_channel_ms = 2500
# Level curve, expressed the way it is designed rather than as a magic constant:
# LEVEL L TAKES `fights_per_level_base` FIGHTS against a same-level encounter, plus
# one more every `fights_per_level_ramp` levels. The XP number is DERIVED from the
# encounter tables (a same-level encounter sits at `d = 12.5 x L`, since
# mlevel(d) = round(d / 12.5)), so retuning creature XP retunes the ladder with it
# instead of silently desyncing.
#
# The ramp is gentle through the first act on purpose. Level 10 is the gate on your
# SECOND party slot, so everything before it is played solo — and the old (L + 1)
# shape charged 54 at-level fights for it, most of a first session spent in the
# game's least interesting configuration. Here it costs 22, while level 20 costs 65
# and level 30 costs 128 (the old shape wanted 209 and 464). The goal this is tuned
# against: most players reach doubles before the run that kills them. [TUNABLE]
#
# AND IT PLATEAUS PAST THE KNEE. The ramp keeps rising forever if you let it, and past
# `fights_per_level_knee` that is charging more for less: a martial class's ability
# ladder tops out at 100 (`skills::ladder_top`), so every level after it buys stats
# alone. The slope past the knee is `fights_per_level_ramp_late` — one more fight every
# 15 levels rather than every 5 — which still RISES (21 fights at 100, 31 at 255) while
# cutting the 1 -> 255 climb from 6,833 at-level fights to 5,109. It has to keep rising:
# out-levelling the ground is the route AD-7 opened for a party that cannot get the
# gear, and a flat ladder past 100 would make it the only route. [TUNABLE]
fights_per_level_base = 2
fights_per_level_ramp = 5
fights_per_level_knee = 100       # levels past here ramp at the slower rate below
fights_per_level_ramp_late = 15
xp_reference_creature = 60       # the XP a mid-table creature pays at distance 0 [TUNABLE]
# NOTE: how many creatures an encounter holds is DERIVED from `[[encounters.group_ramp]]`
# (`Encounters::expected_group_size`) rather than stated twice. A constant here drifted
# from the ramp and priced level 1 — which the ramp keeps as a duel — as a two-creature
# pack, so the first level cost ~6 fights instead of the 2 this section promises.
max_hero_level = 255             # the ceiling a party is expected to reach before a world boss
# A creature far BELOW a hero teaches it nothing. XP is paid in full while the hero is
# within `xp_gap_grace` levels of the encounter, then falls off linearly to
# `xp_gap_floor_mult` once it is `xp_gap_zero` levels above it.
#
# Without this, "distance is the difficulty axis" was true of danger and false of
# reward: the hub ring paid full XP forever, so a party could grind d=0 to level 16 on
# creatures whose hits floored to 0-1 damage against 160 HP — and then walk into ground
# that killed them in one encounter. Two heroes at level 12 with no XP and no incoming
# damage is what that looks like from the inside. The falloff makes the shallow grind
# flatten out around level 6-8 and puts the next level where the danger is. [TUNABLE]
xp_gap_grace = 3                 # levels above the encounter that still pay in full
xp_gap_zero = 12                 # levels above it at which the payout hits the floor
xp_gap_floor_mult = 0.05         # a kill is still a kill — never zero
# THE OTHER END OF THE SAME AXIS: an encounter ABOVE a hero pays a bonus, so punching
# above your weight is the lever for a party that cannot get the gear. Each level up is
# worth `xp_up_per_level`, and past `xp_up_knee` levels up it steepens to
# `xp_up_per_level_steep` — so +5 pays 1.05x, +10 pays 1.10x and +20 pays 1.25x.
#
# This is deliberately FLAT ACROSS LEVELS, because the bonus the depth curve already
# pays implicitly is not: `base_xp` rides `(1 + d/500)^1.5`, whose *ratio* flattens as d
# grows, so per creature a +20 fight paid 1.82x at level 1 and only 1.11x at level 235.
# The incentive to punch up was therefore largest where the gap is most lethal and
# smallest where it is the only way past a wall — backwards on both counts. This term is
# the part that does not decay, and it is why the deep grind has an exit. [TUNABLE]
xp_up_per_level = 0.01           # +1% a level for the first `knee` levels up
xp_up_knee = 10
xp_up_per_level_steep = 0.015    # +1.5% a level past the knee — fighting way up accelerates
# The cap. Extrapolating the steep slope this is ~+37 levels, past which you are not
# fighting the encounter so much as being carried through it by a teammate or by gear —
# and the depth term is already paying several multiples there on its own.
xp_up_max = 1.5
# Extraction is mostly the Town Portal item, and it is BOUGHT — a dive no longer hands
# you one. Kit is what you chose to bring: buy at the Apothecary, withdraw it at the
# Vault-Deep, and it rides into the next Backpack. A free resupply every dive made the
# shop decorative and "do I have a way home" a question with no wrong answer. Felled
# creatures still sometimes drop one, and walking west into the city wedge is still a
# free return, so nobody is stranded. [TUNABLE]
starting_town_portals = 0
town_portal_drop_chance = 0.2
# Battle heal items are FINITE, and bought for the same reason. A salve is 40% of a
# hero's max HP, so a free three-salve kit was ~1130 HP of healing nobody paid for.
# [TUNABLE]
starting_salves = 0
starting_elixirs = 0

# How the four attributes (Str/Mnd/Dex/Wll) turn into combat stats. A hero's
# attribute = its class base + per-level gain * (level-1); the derived stat is the
# class base stat + (attribute - base attribute) * the coefficient here, so a
# level-1 hero has exactly its class base stats and each level adds growth. All
# coefficients [TUNABLE].
[attributes]
str_to_atk = 1.0        # +physical attack per Str above base (Str -> damage)
mnd_to_power = 1.2      # +manifestation/skill power per Mnd above base (Mnd -> magic dmg)
dex_to_speed = 1.5      # +ATB speed_stat per Dex above base (Dex -> act faster)
wll_to_hp = 2.5         # +max HP per Wll above base (Wll -> HP)
wll_to_def = 0.25       # +defence per Wll above base (Wll -> PHYSICAL resistance)
# Wll answers a blade; MND answers a spell. `def` is subtracted from physical damage and
# `ward` from everything elemental or psychic, which is what stops a caster from being simply
# squishy and gives Mnd a defensive half — the same way Dex buys dodge as well as speed.
# Before this, non-physical ability damage was subtracted by NOTHING at all: `def` only ever
# reached a basic attack, so armour was close to irrelevant against every boss in the game.
mnd_to_ward = 0.25      # +ward per Mnd above base (Mnd -> ELEMENTAL/psychic resistance)
# ⚠️ `base_ward` (per class) is deliberately 0 for martials and 1 for casters, NOT the 2-4 it
# started at. Ward is subtracted FLAT, and an early creature ability deals about 4 — so a
# base of 4 floored it to 1 and made a level-1 party nearly immune to the elemental half of
# the game. (`field_item`'s bot could no longer get wounded at all, which is how this was
# caught.) Same trap as flat magnitudes on heroes: what reads as small next to a level-100
# number is total next to a level-1 one. Ward is meant to be EARNED from Mnd.
dodge_dex_floor = 10    # Dex at/below this gives no dodge (martial/caster classes
                        # start here or below, so their dodge is earned by leveling;
                        # the Shifter is the deliberate exception — its base Dex is
                        # above the floor, so it slips attacks from level 1)
dodge_per_dex = 0.012   # dodge chance gained per Dex above the floor
dodge_cap = 0.35        # maximum dodge chance

[battle]
tick_ms = 100                    # CANON §B ATB tick
# gauge += speed_stat / divisor per 100ms tick; a turn fires at gauge 1.0.
# 5200 → a speed-110 explorer acts every ~4.7s and the speed-80 stalker every
# ~6.5s: a readable FF5-style ATB cadence, eased off the previous 4400 (~4.0s)
# after "too fast" playtest feedback while still keeping a 4-hero party busy
# (a hero acts roughly every ~1.3s across the party, so nobody idles). Was
# 400 = ~0.4s, a blur.
gauge_fill_divisor = 5200.0
turn_timeout_ms = 15000          # 15s -> auto-defend
flee_base = 0.60
flee_penalty_per_tier = 0.10
flee_floor = 0.05
# Fleeing saves your heroes but not your haul — you bolt and spill some of what
# you were carrying (combat-atb.md). On a successful flee the run CONTINUES (unlike
# death), but you forfeit this fraction of your un-banked chits and each
# non-permanent item (backpack material / red-chest looted gear) rolls to drop at
# `flee_item_drop_chance`. Insured (blue) equipped gear is never at risk. [TUNABLE]
flee_chit_loss_fraction = 0.5
flee_item_drop_chance = 0.25
merge_cap_normal_instances = 2   # CANON D5
merge_cap_gatekeeper_instances = 4
defend_damage_reduction = 0.5    # content-defined; spike default
# Front/back row (formation). Caster classes (Psyker/Resonant) stand in the back
# row: they take `back_row_damage_mult` of incoming damage, and the enemy AI, when
# the weakest foe it would strike is in the back row, only commits to it
# `back_row_target_weight` of the time (otherwise it redirects to the weakest
# exposed front-row hero). Martial classes hold the front. [TUNABLE]
back_row_damage_mult = 0.5
# …and the other half of the trade: a hero in the back rank also deals this share of its
# own PHYSICAL damage. Without it the back row was a free 2x effective HP for the whole
# party — nothing reached past it and nothing was given up for it, so the optimal formation
# was everyone standing back. A caster loses nothing here (its damage is not physical),
# which is exactly why the back row is a caster's home and the front line is a martial's.
back_row_attack_mult = 0.5
back_row_target_weight = 0.5
# SWEEP: what each ADDITIONAL body in the swept rank takes, as a share of the attacker's
# attack. A whip is a wide blow rather than several good ones, so the extras land softer and
# never crit. UNTUNED — a placeholder pending an MCP measurement, because sweep output is
# `share x rank size` and rank size is itself still an untuned number. What the tests hold is
# the RELATIONSHIP, not this value: a sweep must lose to a single-target weapon against one
# body and beat it against a full rank.
sweep_share = 0.45
party_size_per_player = 4        # each player controls up to this many heroes (GDD: per-player party) [TUNABLE]
skill_power_mult = 1.75          # "Power Strike" skill: damage = atk*mult - def [TUNABLE]
skill_heal_fraction = 0.3        # "Second Wind" skill: heals this fraction of max HP [TUNABLE]
item_heal_fraction = 0.4         # "Salve" item: heals this fraction of max HP [TUNABLE]
                                 # "Elixir" item: full heal (structural, no coefficient)
# Critical hits — every basic attack can crit for a burst of damage. Chance scales
# with the attacker's Dex, so the Shifter's precision theme lands more crits; the
# damage is multiplied and the hit pops on the client. [TUNABLE]
crit_chance_base = 0.08          # base crit chance on a basic attack
crit_chance_per_dex = 0.004      # + this per point of the attacker's Dex
crit_chance_cap = 0.5            # a crit is never a sure thing
crit_mult = 1.8                  # damage multiplier on a crit
# Psyker Focus system. A Psyker maintains several persistent Manifestations
# ("Foci"); on each of its ATB turns every active Focus fires, then the player
# casts/reinforces/revokes one. Focus slots and which manifestations are unlocked
# scale with level. All [TUNABLE].
psyker_focus_base = 2             # focus slots at level 1
# +1 slot every this many levels. Scaled from the class doc's ladder (Focus 2 at
# D&D 1 → 5 at D&D 17), which on our 255 cap puts the 5th slot around level 85.
psyker_focus_per_level = 28
psyker_focus_cap = 5             # hard cap on focus slots

# The deep Manifestations (meld_proto::skills; the Psyker is a CASTER archetype, so
# its ladder runs to level 100). Each multiplier is applied to the Psyker's
# spell_power on every tick the Focus is held. AoE manifestations are tuned BELOW the
# single-target ones per target, because they hit the whole line. [TUNABLE]
psyker_wave_tick_mult = 0.32          # Kinetic Wave (L25): all enemies
psyker_thermal_tick_mult = 0.62       # Thermal Flux (L36): one foe, fire-typed
psyker_dissolution_tick_mult = 0.5    # Matter Dissolution (L49): one foe...
psyker_dissolution_armour_shred = 2   # ...and its armour corrodes this much per tick
psyker_phase_evasion = 0.06           # Phase Shift (L64): Evasion granted per tick
psyker_collapse_tick_mult = 0.55      # Reality Collapse: all enemies, armour-ignoring
# Gravity Vortex (255), the caster capstone: it grinds the line AND slows every enemy's gauge
# FILL RATE (via `status_slow_mult`, the same multiplier a web or a chill uses) for as long
# as it is held. The damage is deliberately modest — the tempo is what you pay 255 levels for.
#
# It slows the RATE rather than capping the gauge, and that is not a detail: creature
# `speed_stat` is a fixed constant that never scales while a hero's climbs with Dex, so a
# level-255 Psyker takes several turns per creature turn. A cap would knock every creature
# back below the line each time it approached one and they would never act again. The window
# is a little longer than a Psyker's own turn so the slow never lapses while the Focus is up.
psyker_vortex_tick_mult = 0.35
# Gravity Well's ASPECTS (the doc's Pressure -> Gravity -> Anchor chain). Each occupies its
# own Focus slot and re-applies its mark every Psyker turn, so the hold lasts exactly as
# long as the Focus is held. `anchor` is the deepest slow in the game and is still a RATE:
# a creature's speed_stat never scales with distance, so a gauge that stops advancing is a
# creature that never acts again. 0.2 crawls; it does not lock.
psyker_anchor_slow_mult = 0.2
# Mind's Eye + Dual Manifestation, which are ONE mechanic: a cast that does not spend the
# turn. A controller holding three Foci otherwise opens every fight with three turns of
# pure setup. Mind's Eye seeds the pool once at battle start; Dual Manifestation tops it
# back up each Psyker turn from `psyker_dual_manifest_at`, so a deep Psyker raises two
# Foci per turn forever rather than only at the opening.
psyker_minds_eye_at = 5             # hero level at which the opening free cast appears
psyker_minds_eye_per_level = 45     # …and one more every this many levels
psyker_minds_eye_cap = 3            # never more than this at the top of a fight
psyker_dual_manifest_at = 75        # hero level from which every Psyker turn refunds one cast
# Expansion: an offensive Focus also grinds this many OTHER living enemies. The doc's
# passive on Gravity Well, generalised — a controller should widen with level, and the
# alternative (more damage) is the one thing this class is not for.
psyker_expansion_at = 35
psyker_expansion_per_level = 70
psyker_expansion_cap = 3
psyker_expansion_mult = 0.5         # share of the primary tick each extra enemy takes
psyker_aspect_ticks = 40          # ticks an aspect's mark outlives the turn that applied it
# The rest of the doc's aspect chains, one per manifestation whose aspect ports to an ATB.
# (Its reaction aspects — Dampen, Static, Vent, Flicker, Rewind — and its positional ones —
# Push, Pull, Warp — have no home here: this engine has no reactions and no battlefield
# positions. Those stay unbuilt rather than reinvented as something else wearing the name.)
psyker_shield_party_fraction = 0.06   # Shield: Barrier per ally per turn, as a share of max HP
psyker_accel_gauge = 0.22             # Acceleration: gauge filled on the chosen ALLY per turn
psyker_blackout_ticks = 30            # Blackout: ticks the blinding lasts per turn
# Added to the DEFENDER's dodge while a blinded creature is the one swinging — accuracy
# lives on the defender in this engine, the same place a dazzle lands. Under the Explorer's
# `explorer_misdirection_miss` (0.30): Misdirection is that class's whole L10 identity, and
# an aspect held on one creature should not out-blind it.
psyker_blackout_miss = 0.25
psyker_vortex_ticks = 80
# Per-tick magnitudes (multiplied by the Focus's stack count, 1–2):
psyker_gravity_tick_mult = 0.55   # Gravity Well: dmg = atk*mult*stacks (ignores def)
psyker_spike_tick_mult = 0.9      # Mind Spike: stronger armour-ignoring dmg tick
psyker_aegis_tick_fraction = 0.1  # Kinetic Aegis: Barrier granted = max_hp*frac*stacks
psyker_anchor_gauge_drain = 0.2   # Temporal Anchor: enemy ATB gauge -= drain*stacks

# Barrier (temp HP): a pool that absorbs damage before HP and decays a fixed
# amount at the start of each of the holder's turns. [TUNABLE]
# A SHARE OF THE POOL rather than flat points, with a 1 HP floor so it always drains. A
# flat 2 was three turns of a level-1 hero's 5-point Barrier and ~60 turns of a level-100
# hero's 118-point one — so the deep game's Barriers never expired at all.
barrier_decay_fraction = 0.15
# REGEN DECAYS TOO, and for the same reason. It was the one lasting effect with neither
# decay nor expiry, so a healer spending turns on it bought permanent party sustain that
# only ever grew. It sheds this share of itself each of the holder's turns (floor 1), and
# when it is spent the stacks it cost come back. [TUNABLE]
regen_decay_fraction = 0.2
# THE STACK CEILING, shared by every lasting effect — Regen, Barrier, Evasion and the
# fight-long attack buff. One number so "how many of these can I hold" is something a
# player learns once instead of four things they discover. A grant past the ceiling is
# refused outright rather than silently wasted. [TUNABLE]
max_effect_stacks = 5

# The Resonant (healer). Innate Regen (HP restored at the start of each of its
# turns), plus three ally-targeting skills that auto-pick the most-wounded ally:
#   Transfuse   — heal an ally for a fraction of the Resonant's max HP, paying
#                 `cost_fraction` of that heal out of the Resonant's own HP.
#   Regen Boon  — grant an ally the Regen status.
#   Ward        — grant an ally Barrier.
# All [TUNABLE].
# REGEN IS A FRACTION OF THE HOLDER'S MAX HP PER TURN, everywhere. Flat Regen was
# consistent across classes but became decorative past ~level 40, which is most of the
# ladder. The granted value is still stored as absolute HP on the fighter (so the wire
# token `regen:<n>` and the client are unchanged) — the FRACTION is what scales it to
# whoever receives it.
resonant_regen_fraction = 0.02
resonant_transfuse_heal_fraction = 0.4
resonant_transfuse_cost_fraction = 0.5
resonant_boon_regen_fraction = 0.03
resonant_ward_barrier_fraction = 0.3

# The Shifter (rogue / fortune-explorer, "Runner"). A fast, fragile front-line
# skirmisher that reads the reality-glitches of the Shifting Lands. Its whole kit
# is atk-driven (Str) precision:
#   Backstab — heavy strike that pierces most of the target's armour (shines on
#              deep, well-armoured creatures where a plain attack stalls).
#   Flicker  — a reality-blink that grants the Shifter Evasion (a temporary dodge
#              bonus, added to its Dex dodge) which decays each of its turns.
#   Ransack  — a strike that also drains the enemy's ATB gauge (grab-and-run: it
#              staggers, echoing the Psyker's Temporal Anchor but as a one-shot).
# All [TUNABLE].
shifter_backstab_mult = 1.5      # Backstab: dmg = atk*mult, minus reduced armour
shifter_backstab_pierce = 0.75   # fraction of the target's defence Backstab ignores
shifter_flicker_evasion = 0.4    # Flicker: dodge bonus granted (added to Dex dodge)
shifter_flicker_decay = 0.15     # Evasion lost at the start of each of the Shifter's turns
shifter_ransack_mult = 1.0       # Ransack: dmg = atk*mult - def
shifter_ransack_drain = 0.35     # Ransack: enemy ATB gauge -= this on hit
# The deep rungs (49, 100). A martial class reaches the top by its EXISTING rows getting
# better, never by growing a fifth button — so these upgrade Backstab and Ransack in
# place and the Shifter still fields four. [TUNABLE]
shifter_assassinate_mult = 2.2   # Assassinate (49, upgrades Backstab): dmg = atk*mult
shifter_assassinate_pierce = 1.0 # ...and it ignores armour ENTIRELY, not just most of it
shifter_larceny_mult = 1.2       # Grand Larceny (100, upgrades Ransack): to EVERY enemy
shifter_larceny_drain = 0.45     # ...and drains each of their gauges by this

# The HUNTER (martial baseline). It has no special resource until it earns one: every
# basic Attack banks `adrenaline_per_attack` Adrenaline (up to `adrenaline_max`), and
# EVERY skill SPENDS that bank — a skill is rejected unless the Hunter has banked its
# cost. So the Hunter's rhythm is attack-attack-attack, then unleash:
#   Power Strike — a heavy hit (reuses the generic `skill_power_mult`).
#   Second Wind  — a self-heal for `skill_heal_fraction` of max HP.
#   Snare        — pins the prey: damage plus an ATB-gauge drain (capture flavour).
#   Frenzy       — an adrenaline-fuelled onslaught: the biggest hit, biggest cost.
#
# THE `explorer_*` KEYS BELOW ARE HUNTER ABILITIES. Adrenaline moved to the Hunter when
# the Explorer became the mapping order; the keys did not follow, because renaming a
# tunable collides with every branch in flight. This paragraph is the record: the
# Explorer banks NOTHING and pays for nothing. Reading these names as the truth is what
# put the Hunter's kit in the Explorer's unlock banner for a whole release.
# All [TUNABLE].
hunter_adrenaline_max = 100          # cap on banked Adrenaline
hunter_adrenaline_per_attack = 25    # Adrenaline banked by each basic Attack
hunter_power_strike_cost = 40        # Power Strike: Adrenaline spent (dmg uses skill_power_mult)
hunter_second_wind_cost = 35         # Second Wind: Adrenaline spent (heal uses skill_heal_fraction)
hunter_snare_cost = 30               # Snare: Adrenaline spent
explorer_snare_mult = 1.0              # Snare: dmg = atk*mult - def
explorer_snare_drain = 0.5             # Snare: enemy ATB gauge -= this on hit
hunter_frenzy_cost = 80              # Frenzy: Adrenaline spent
explorer_frenzy_mult = 3.5             # Frenzy: dmg = atk*mult - def
# The deep rungs (49, 100). Both UPGRADE a row the Hunter already has and cost exactly
# what the row they replace cost — the kit gets better, the Adrenaline economy does not
# move, and the menu stays four wide. [TUNABLE]
hunter_iron_lung_heal_fraction = 0.45  # Iron Lung (49, upgrades Second Wind): heal = max_hp*this
hunter_iron_lung_regen_fraction = 0.05 # ...and Regen a turn on top, so the wound keeps closing
hunter_apex_mult = 2.6                 # Apex Predator (100, upgrades Frenzy): to EVERY enemy

# The Order of the Phoenix Guard (anti-undead tank). A dense, deliberate front-line
# wall. Its kit is level-gated — no build-up resource.
#
# THE KEY NAMES BELOW ARE THE OLD IRON HULL KIT, one rename behind the abilities they
# actually drive (renaming a tunable collides with every branch in flight). What they
# really tune, in `resolve_phoenix_guard`:
#   swell_*      — Silvered Strike: a heavy blow that also staggers (gauge drain).
#   root_*       — Rite of Rest: grant self Barrier as a fraction of max HP.
#   shock_*      — Holy Censure: a heavier blow that FULLY zeroes the target's gauge.
#   toll_*       — Purging Light: the all-enemy one.
# The kinetic/oar kit these were named for belongs to a future `iron_hull` monk class.
# All [TUNABLE].
phoenix_guard_swell_mult = 1.4            # Swell Strike: dmg = atk*mult - def
phoenix_guard_swell_drain = 0.3          # Swell Strike: enemy ATB gauge -= this on hit
phoenix_guard_root_barrier_fraction = 0.25 # Root: Barrier granted = max_hp * fraction
phoenix_guard_shock_mult = 1.6           # Kinetic Shock: dmg = atk*mult - def (then gauge → 0)
phoenix_guard_toll_mult = 1.1            # Toll of the Deep: dmg = atk*mult - def to EVERY enemy
# Phoenix Guard, the anti-undead order (docs/lore/factions.md). Their whole reason
# to exist is undead, so every damaging ability of theirs hits undead this much
# harder — the one number that makes them a counter rather than a re-skin. [TUNABLE]
phoenix_guard_undead_mult = 1.6
# GAUGE DENIAL, priced. A knock takes a turn; the guard that follows stops it being every
# turn; the stagger is what the knock buys beyond tempo.
#
# `gauge_guard_turns` is how many of its OWN turns a fighter must take before it can be
# knocked again. It comes up as the fighter DOES, so it survives the recovery turn — at 1 the
# guard would lapse the instant it stood and the party could re-knock immediately, making
# EVERY boss turn a rebuke. At 2 a boss gets one clean turn between denials. Counted in turns
# rather than ticks on purpose: creature `speed_stat` is a fixed 40-125 while a hero's climbs
# with Dex, so a timer can lapse before a slow creature's gauge has refilled and the lock
# resumes — counted in turns, "it always gets turns" is unconditional. [TUNABLE]
gauge_guard_turns = 2
# What a knocked-down fighter takes from EVERYTHING until it is back up. The reward for
# spending a turn on denial: without it a knock buys only tempo, which is thin for an ability
# that could have been damage. Applied in `apply_damage_reaching`, the one point every hit
# passes through, like the blaze bonus beside it. [TUNABLE]
staggered_damage_mult = 1.35
# Unbroken Vigil (Redeemer, L13): Barrier for the WHOLE party, as a fraction of each
# ally's own max HP — smaller than the self-only Rite of Rest, because it lands on
# four heroes instead of one.
phoenix_guard_vigil_barrier_fraction = 0.14
# Eradication (Apotheosis, L17): an execute. Damage scales with how hurt the target
# already is — `mult + bonus * missing_hp_fraction` — so it finishes rather than opens.
phoenix_guard_eradication_mult = 1.2
phoenix_guard_eradication_missing_bonus = 2.2
# Hallowed Ground (49): the wall stops EVERYTHING — damage to every living enemy that
# also zeroes each of their gauges. Its multiplier sits below Purging Light's because a
# full party-wide stagger is worth more than the damage is. [TUNABLE]
phoenix_guard_hallowed_mult = 0.9
# Phoenix Ascendant (100): the order's own fire. Heavy on every enemy (and far heavier
# on undead, via `phoenix_guard_undead_mult`), and the same flame Barriers the party.
phoenix_guard_ascendant_mult = 1.8
phoenix_guard_ascendant_barrier_fraction = 0.18

# THE ORDER OF THE IRON HULL — the monk order the Phoenix Guard's tunable NAMES above were
# borrowed from while it was still only lore. Those keys stay where they are (renaming one
# collides with every branch in flight); these are the order's own, and they tune
# `resolve_iron_hull`.
#
# THE DOCTRINE OF EQUILIBRIUM IS THE BALANCE, not just the flavour: every row here is
# priced below the Phoenix Guard's equivalent on raw damage and paid back in TEMPO — a
# stagger, a drain, a Barrier. An order whose whole art is returning momentum should not
# also win the damage comparison, or the Guard has no reason to exist. [TUNABLE]
# UNARMORED DEFENCE (the D&D monk's). The order wears no armour and holds no weapon, so
# what hardens as it climbs is its own discipline: `def` per level, on top of the Wll
# derivation every class gets. This is the class's answer to "how does an unarmoured
# fighter survive the deep world" — the other half being that it is hard to hit at all.
#
# SIZED AGAINST THE WALL, because that is the only comparison that means anything. The
# Phoenix Guard gains 1.0 def a level from Wll alone (wll_per_level 4 x wll_to_def 0.25);
# the monk gains 0.5 the same way, so this has to exceed 0.5 for its discipline to
# out-climb plate at all. At 0.6 it gains 1.1 a level and passes the Guard slowly — the
# D&D shape, where a high-level monk eventually out-ACs plate.
#
# That does NOT dethrone the wall, and it is worth being explicit about why: the Guard
# still has far more HP, and heavy armour carries its own `weight_profile` resistances that
# a robe does not. Equal `def` is not equal toughness. What the monk buys with this is the
# right to stand in a deep fight at all, having given up both armour and a weapon.
# [TUNABLE]
iron_hull_unarmored_def_per_level = 0.6
iron_hull_oar_mult = 1.25                 # Oar-Fighter: dmg = atk*mult - def
# Sea-Legs: self Evasion, decaying per turn. Above the Explorer's party-wide Safe Passage
# (0.22) and below the Shifter's Flicker (0.4) — this order's whole survival plan is not
# being hit, but the Runner is still the one that does it best.
iron_hull_sea_legs_evasion = 0.3
iron_hull_swell_mult = 1.15               # Swell-Step: dmg, then the drain below
iron_hull_swell_drain = 0.35              # …and the tempo taken with it
iron_hull_rooting_barrier_fraction = 0.28 # Structural Rooting: self Barrier = max_hp * this.
                                          # Above the Guard's Rite of Rest (0.25) on purpose:
                                          # the Guard keeps its mobility and this order is
                                          # spending a turn to give its up. Root over reach.
iron_hull_shock_mult = 1.5                # Kinetic Shock: heavy, and it STAGGERS (deny_gauge)
# HULL RESONANCE (50) — the encoded hum through the ship's skeleton. A fraction of each
# ally's OWN max HP, like every other party-wide grant: a flat number is a third of a hero
# at level 1 and a rounding error at 100.
iron_hull_resonance_barrier_fraction = 0.13
# THE RESONANT WAKE (75) and TOLL OF THE DEEP (100) — the acoustic half, and the reason
# this order exists mechanically. Both land as `Ethereal`, NOT as a physical type, so a
# back rank is no protection: a melee class with an answer to the rear is the trade for
# giving up the Guard's armour. Neither is `DamageType::None` — that bypasses every
# resistance in the game and is TRUE damage, which is not what "sound" should mean.
iron_hull_wake_mult = 0.95                # all-enemy, plus the drain below on each
iron_hull_wake_drain = 0.2
iron_hull_toll_mult = 1.3                 # the bell: all-enemy, ONCE a fight…
iron_hull_toll_barrier_fraction = 0.12    # …and the party braced behind it

# THE WALL DEFENSE FORCE — the Rift Drop-Trooper (`resolve_rift_knight`). A dragoon whose
# leap is a teleport.
#
# EVERY MULTIPLIER HERE IS PAID FOR BY A TURN THE PARTY FIGHTS ONE HERO SHORT. That is the
# whole class, and it is why these numbers are the highest single-target values in the
# game without being a balance problem: a Dive removes the knight from the fight for a
# window, so its damage-per-turn is not its damage-per-blow. Tune the WINDOW before tuning
# the multiplier — lengthening `dive_untargetable_ticks` is a buff to survival and a nerf
# to tempo at the same time, which is the honest dial. [TUNABLE]
rift_knight_blink_mult = 1.3              # Blink Lance: arrives behind the line (ignores rank)
rift_knight_recall_atk_fraction = 0.16    # Recall Blade: self atk += base_atk * this, for the fight
rift_knight_dive_mult = 1.9               # Dimensional Dive: the drop
# How long the knight is GONE. Counted in engine ticks (100 ms), and it is the cost half of
# the ability: untargetable, but also unable to act. Long enough to skip a telegraphed
# boss row, short enough that the party is not fighting three-handed for a whole round.
rift_knight_dive_untargetable_ticks = 12
rift_knight_payload_mult = 2.3            # Kinetic Payload (35): upgrades Blink Lance
rift_knight_breach_mult = 2.5             # Breach Point (50): upgrades the Dive…
rift_knight_breach_splash_mult = 0.55     # …and carries this much to every OTHER enemy
rift_knight_gate_barrier_fraction = 0.13  # Blast-Gate Lockout: party Barrier, per ally max_hp
rift_knight_cataclysm_mult = 1.7          # Grand Cataclysm (100): all-enemy, ONCE a fight…
rift_knight_cataclysm_drain = 0.4         # …and every one of them loses its footing

