# Martial UPGRADE chains (meld_proto::skills `upgrades`). A martial class progresses
# by its rows getting better, not by growing more of them, so each of these replaces
# an earlier ability and is tuned above it. [TUNABLE]
shifter_steal_drain = 0.5          # Steal: strip this much of the foe's ATB gauge
# What comes off the body. Chits scale with the creature's distance so a deep theft
# is worth the trip; the material chance is the "finders, keepers" roll. [TUNABLE]
shifter_steal_chits_per_tier = 6
shifter_steal_material_chance = 0.35
shifter_mug_mult = 1.35            # Mug: Steal, plus a hit on the way past
shifter_mug_drain = 0.6
hunter_crushing_blow_mult = 2.1    # Crushing Blow: replaces Power Strike (1.5)
pin_the_prey_mult = 1.15           # Pin the Prey: replaces Snare, and drains more
pin_the_prey_drain = 0.45

# Monster-ability system (Creature AI spec §2). All [TUNABLE].
status_slow_mult = 0.5               # ATB fill mult while webbed/chilled/bound/…
poison_dot_fraction = 0.05           # poison: max_hp fraction lost per victim turn
burn_dot_fraction = 0.04             # burn: max_hp fraction lost per victim turn
basic_attack_weight = 3              # weight of the basic attack in every AI roll
steal_chits_fraction = 0.10          # chit-steal: fraction of carried chits taken

# Creature loot (economy.md sources S1). A felled encounter yields, banked into
# the run backpack and minted into the persistent economy only on extraction
# (deleted on death — it never entered circulation, economy.md I1):
#   - Chits: `round(chits_per_mlevel * mlevel(d) * monster_count * jitter)`, where
#     jitter ∈ [1-chits_jitter, 1+chits_jitter]. Deeper fights pay more.
#   - One of the biome's combat materials per felled encounter (feeds crafting;
#     biome→material map is structural, in meld-world::combat_material_for_biome).
#   - Red-chest gear (insurance:red), at/after world_scaling.red_chest_floor_
#     distance (300 — spec §4: no gear shallower than d=300), dropping with
#     `gear_drop_chance`. Rolled atk bonus = `round(gear_atk_per_tier * tier(d) *
#     jitter)`, jitter ∈ [1±gear_atk_jitter]; the catalog name (meld-world::
#     gear_catalog_name) scales with the same tier, so early gear reads as early
#     gear even though the floor is gone.
# All [TUNABLE] — pure balance.
[loot]
chits_per_mlevel = 5.0
chits_jitter = 0.35
# TROPHY yield per felled encounter (MS-1). A trophy is the material a kill leaves,
# so supply tracks the pack you actually beat: one per carcass, plus a band bonus so
# the deep bands (whose materials the top recipes want) pay for the walk. Multiplied
# by the elite/gatekeeper reward spike, and drawn WITHOUT rng — a crafter should be
# able to plan a hunt. [TUNABLE]
material_per_creature = 1.0
material_qty_per_tier = 0.2
gear_drop_chance = 0.35
# GR-8: the gear chance RAMPS from `gear_ramp_start_mult` of `gear_drop_chance` at
# `gear_ramp_start_distance` to all of it at `world_scaling.red_chest_floor_distance`.
# A flat cutoff at the floor cannot work here, because the two tunables that meet at
# this line are set independently: the 8-area chain's deep portal lands at d≈342-384,
# so a cutoff at d=300 leaves gear at a measured 0% for ~85% of every dive and 35%
# only in the stretch you cross on the way out. The ramp keeps what CANON §B is
# protecting — deep is where the gear game lives — with no depth at which the chase
# does not exist at all. It reaches exactly 1.0 at the floor, so deep rates are
# untouched by it. [TUNABLE]
gear_ramp_start_distance = 40
gear_ramp_start_mult = 0.15
# GR-8: P(a felled encounter also drops a potion), band-capped by `tier(d)` against
# each potion's own `ConsumableDef::tier`. The cap is what keeps the Apothecary and
# Alchemy the RELIABLE supply — a drop is a top-up you are glad of, never a reason
# not to brew — and holds the trophy line behind the depth it was authored for.
# [TUNABLE]
potion_drop_chance = 0.18
# Of the gear a REWARD-SPIKE encounter drops (elite / gatekeeper / undead rite /
# chest — anything carrying a `loot_mult`), the fraction that is PERMANENT (blue):
# it survives death and wears down instead of burning. Ordinary creatures never drop
# it at any depth, so a permanent piece is something you fought something real for.
# Deliberately low — permanence is the reward that makes a loadout worth saving.
# [TUNABLE]
# The three gear tiers, rolled only on a REWARD-SPIKE encounter (elite / gatekeeper
# / rite / chest — anything carrying a `loot_mult`). Ordinary creatures always drop
# standard, at any depth. The two chances are cumulative slices of one roll, so they
# must sum to well under 1.
#
# Ephemeral is the STRONGEST gear in the game and it burns twice over: the moment you
# reach the city, AND when the hero wearing it goes down (not merely on a wipe — a fall,
# the same trigger the insured durability tax uses). So it is power you can only spend
# inside the run that found it, on a hero that survives. What it buys is not only a bigger
# number (`ephemeral_power_mult`) but a wider BUILD — see `[affix] count_ephemeral_bonus`.
# An ephemeral piece is also never Common, structurally: a common carries no affixes, and
# a piece that burns twice for one inflated stat is worse than the drop beside it.
# Insured sits above ordinary kit, survives a wipe, and erodes until it breaks. [TUNABLE]
ephemeral_gear_chance = 0.10
ephemeral_power_mult = 1.60
permanent_gear_chance = 0.15
insured_power_mult = 1.15
# What one HERO DEATH costs that hero's INSURED gear, in POINTS of max durability.
# Charged per fall, not per wipe (GR-2) — a hero the party carries home still went
# down, so repair is a standing cost rather than a bill only a lost run presents. A
# wipe needs no separate rate: it is every hero falling, so it charges each once.
#
# Flat points rather than a fraction, and that is the whole design: a piece's own
# `max_durability` is what decides how many deaths it survives
# (`ceil(durability / loss)`), so "this one is better made" is a real difference
# between two drops instead of a number that reads the same on all of them. A
# fraction of current max cannot express that — every piece would last identically
# and approach zero without ever arriving.
# [TUNABLE]
durability_loss_per_fall = 30
gear_atk_per_tier = 3.0
gear_atk_jitter = 0.4
# The MEAN durability of a rolled piece, jittered per drop. With the loss above, 80
# is ~3 deaths (2 on a poor roll, 4 on a good one) — which is the intended feel: a
# dive that costs you a hero costs you a visit to a smith, and gear you never repair
# does not survive a bad week. `masterwork` (the "of Masterwork" affix) lifts a piece
# clear of the band, to 4-6.
# [TUNABLE]
gear_base_durability = 80
gear_durability_jitter = 0.35

# Encounter variety (FS-4). Most creatures are Standard; a fraction roll ELITE
# (champions — tougher, richer loot), and a GATEKEEPER guards each biome-band
# border (a big unavoidable boss with a guaranteed haul). Difficulty still rides
# distance; these multiply on top. Elite/gatekeeper mobs are marked on the wire
# (encounter_class) so the client sizes + tints them distinctly. [TUNABLE]
[encounters]
elite_chance = 0.11              # fraction of standard creatures promoted to Elite
elite_hp_mult = 2.4              # Elite HP vs a standard creature at the same distance
elite_atk_mult = 1.35
elite_xp_mult = 3.0
elite_loot_mult = 3.0            # chits ×, and boosts the gear-drop chance
# A wall of HP, PER PARTY. This was 10.0 and commented "sized to the party over a merge" —
# which meant every gatekeeper was secretly a four-party raid boss and never said so. Measured:
# a level-40 party ground a 66,792 HP gatekeeper for 464 turns with nothing on screen to warn
# it. The party count is declared now (`meld_proto::warbands`) and multiplies this.
#
# 5.0 rather than a quarter of the old 10.0, because a boss has to stay a REAL fight for ONE
# party — `outgrowing_a_fight_lets_you_stomp_it` holds a boss at parity to 20+ rounds, and 2.5
# folded it in twelve. So an ordinary gatekeeper is a 5x wall a single party can finish, and a
# Worldbreaker is 20x.
#
# THE REASON A STATIC MULTIPLE WORKS: `encounter_party_scale` is a four-entry table indexed by
# hero count and CLAMPED to its length, so creature HP stops growing past four heroes. A merge
# of four parties (sixteen heroes) faces the same pool a lone party of four does while bringing
# four times the damage — which is what makes "sized for N parties" expressible as HP at all,
# and why this multiplying by the party count does not double-count the merge. [TUNABLE]
gatekeeper_hp_mult = 5.0
gatekeeper_atk_mult = 1.6
# P(a gatekeeper is a RAID, sized for more than one party) and how deep the roll can reach.
# A raid boss is the fat reward on the door, so it must be rare enough to be an event and
# announced loudly enough that nobody walks into one by accident — the whole point of naming
# it. Weighted toward the shallow end of the ladder: two parties is a plausible ask, four is
# the cap `merge_cap_gatekeeper_instances` allows. [TUNABLE]
gatekeeper_raid_chance = 0.25
gatekeeper_raid_max_parties = 4
# HOW A RAID BOSS ANSWERS A CROWD (FS-4). HP rides the party count and attack deliberately
# does not — a swing lands on ONE hero, so scaling it one-shots whoever arrives before the
# merge fills. Followed through, that same reasoning is the argument FOR scaling the wide
# half: a single-target blow is divided by the crowd in front of it (a quarter of a lone
# party's incoming damage, a sixteenth of a full raid's) while an all-enemy one is divided by
# nothing at all. So the shipped raid boss got EASIER per hero the more help you brought.
#
# MEASURED, playing gatekeepers out over five world seeds
# (`a_raid_boss_answers_a_crowd_with_its_wide_half`): 12.5% of an unlabelled boss's turns go
# wide, which puts a Worldbreaker at sixteen heroes on 52% of the per-hero pressure that same
# boss applies to a lone party — while carrying 20x the health. Four times the damage went in
# and each hero felt half the answer back.
#
# These buy CADENCE, never magnitude: the party-wide rows come round sooner and are rolled
# oftener, and every number a hero takes is the one an ordinary gatekeeper deals. Nothing here
# can turn a hit into a one-shot, which is exactly why it is safe where scaling attack is not.
# Applied to the ROLL and never to the kit — an ability's authored weight is also read as its
# RARITY (`signature_ability` picks the rarest as CN-7's rebuke), so a scaled pool would make
# a Worldbreaker answer an interruption more weakly than the ordinary version of itself.
# At 1.0/1.0 the measured wide share climbs 12.5% -> 23.5% -> 32.9% -> 41.8% across the four
# rungs, which puts a full raid at ~132% of the one-party baseline per hero and an under-manned
# party at ~164% — a raid boss should be the WORSE fight, not merely the longer one. 2.0 was
# tried and reached 59%, which is a boss that does nothing but sweep. [TUNABLE]
raid_wide_weight_per_party = 1.0
raid_wide_cooldown_per_party = 1.0
gatekeeper_xp_mult = 3.0
gatekeeper_loot_mult = 9.0       # a guaranteed, fat reward for clearing the pass
# A boss is a multiple of an ordinary creature's health — and now that health rides
# the same `tier(d)` basis gear power does, a fixed multiple actually HOLDS a fight
# length instead of drifting.
#
# Sized so a party geared for that depth spends roughly 45 rounds (~3.6 minutes of
# pure attacking, past five once a third of turns go to healing and reviving).
#
# Deliberately NOT derived from the party in front of it. Deriving it would guarantee
# the five minutes, but it would also mean a boss never dies faster no matter how
# over-levelled or over-geared you are — and stomping something you have genuinely
# outgrown is the reward the whole gear chase is for. A party carrying tier-40 gear
# into a tier-10 boss should walk through it, and with a fixed multiple they do.
# The undead rite (a risen boss + its dead) is harder than an elite and short of a
# gatekeeper, so it pays between them. Without its own entry it fell through to the
# standard 1.0 and paid trash loot for the hardest fight most players will meet.
undead_rite_loot_mult = 5.0
# PACKS (CR/encounter composition): a lone creature versus a party of four is not a
# fight, so a share of spawns come as a LEADER plus minions clustered inside
# `[ai] group_radius` — touch one and the whole pack joins. Minions are visibly
# lesser (a big spider with four little ones); the leader is a step above a
# standard creature but below an Elite. Never in the spawn section or the tutorial.
pack_spread = 3.0                # minions scatter within this of the leader (< pack_leash)
# HOW FAR A PACK MEMBER ROAMS FROM ITS PACK (CR-11). A pack used to be nothing but
# proximity, and proximity decays: every member drew its wander destination from its OWN
# `[ai] leash_radius` disc (9.0) while `group_radius` (6.5) is what decides whether
# touching one pulls the others, so two members could legitimately stand 21 apart.
#
# MEASURED over three seeds, stepping a generated world with nobody in it: 2,189 leaders
# pulled 10,128 bodies at spawn (4.63 each) and 5,583 after two minutes of ordinary
# wandering (2.55) — 45% of every pack gone, with 440 leaders (20%) standing entirely
# alone. Every pack test ran on an arena that had never been stepped, which is why it was
# invisible.
#
# Members now roam a disc around their LEADER'S SPAWN POINT of this radius. It must stay
# under HALF of `[ai] group_radius`, or two members on opposite rims stop being one
# encounter and the drift comes back — `a_pack_cannot_wander_out_of_its_own_encounter`
# holds that, and `pack_spread` (the spawn scatter) has to fit inside it too, or a minion
# starts life outside the disc it roams. [TUNABLE]
pack_leash = 3.1
leader_hp_mult = 1.7             # the "one big spider" — under an Elite's 2.4
leader_atk_mult = 1.2
leader_xp_mult = 1.8
minion_hp_mult = 0.45            # the "four little ones": individually weak…
minion_atk_mult = 0.6            # …but four of them act four times as often
minion_xp_mult = 0.55
# THE UNDEAD RITE (PG-2): a named UNDEAD boss with a retinue of undead minions —
# the encounter that teaches a player they want a wall, and the one that unlocks the
# Phoenix Guard for surviving it. Rarer and harder than a pack, and it only appears
# once the world is dangerous enough for it to read as a set-piece rather than an
# ambush.
undead_rite_chance = 0.05        # P(a spawn past the floor becomes the rite) [TUNABLE]
# THE END FIGHT (EW, first cut). Past this distance one encounter becomes three named
# bosses standing together — not a boss with a retinue, three peers — and it is GUARANTEED
# rather than rolled, because it is the thing the whole walk is pointed at. d3200 is where
# it sits because `base_run_level` reaches the 255 cap at d3256: the last distance that is
# still a fair fight by construction (see PG-2). Fleeing is off the table (it reports as a
# Gatekeeper-class encounter), and felling it ENDS the dive — you are put back in town, at
# level 1, holding what you carried out plus three insured pieces.
end_fight_min_distance = 3200
end_fight_bosses = 3
# AUTHORED, not a multiple of the local creature. At d3200 an ordinary creature already
# runs ~10k HP and two-shots a hero, so `x4 of local` made this ~14x harder than anything a
# party can bring. The numbers below are tuned against a ~level-100 party.
#
# ⚠️ **THAT TUNING TARGET IS A PARTY THAT CANNOT REACH THIS FIGHT.** Measured: d3200 ground
# demands ~level 251 to survive four basic hits from a STANDARD creature, and a level-100
# hero survives 1.4 — while needing ~46 hero-hits (x4.4 party scale, so ~200) to fell one.
# Levels are dive-scoped, so there is no accumulating your way there either. Every number
# here was therefore measured at d30 through `MELD_END_FIGHT_AT`, against a party that
# skipped the journey — and, before the fix, through an inert `MELD_GEAR_TIER`. Read them as
# a laboratory result, not as a fight anyone has had.
#
# The old note here said "raise them when hubs land and parties arrive at 255". Hubs are
# RETIRED (PG-2): the arrival level is now whatever a player-built forward town grants
# (`BD-5`), so the target is `base_run_level` at whatever depth players actually plant one
# near d3200 — about 251 if they reach it. Do not retune until BD-5 lands and the fight can
# be played by a party that walked to it.
#
# `encounter_party_scale` still multiplies HP by party size on top of these, so a solo
# player meets 1.0x and a full party 4.4x — the authored number is the per-boss baseline.
#
# **It is MEANT to expect really good loot, and today it does not** — see the warning on
# the attack line below. That intent is live design work, not a property these numbers hold.
#
# TUNED BY PLAYING IT (mcp/), after three passes of arithmetic shipped it impossible.
# Incoming damage scales with the attack number and party output does not, so ATTACK is the
# fight-LENGTH dial and HP is the win-condition dial — cutting HP alone leaves the party
# dying on the same turn, just with more of the bosses' health gone.
#
# At 210/1000 the fight sits on a knife edge that PLAY decides, which is what an apex should
# be. Measured runs of the same geared level-100 party, differing only in how it used its
# three starting potions:
#   never drinks .................. defeat, 75% removed
#   drinks on itself .............. victory, 38 hero-turns, one hero left at 872/1042
#   pours into the lowest-% hero .. defeat, 67% removed  (wrong target — see below)
#   pours where most HP returns ... victory 37 turns / defeat at 76%, run to run
# That last line is the real finding: with the reference policy the outcome is roughly a
# COIN FLIP at identical seed and settings, because ATB is real-time and the order actions
# land in is not reproducible. A competent player therefore wins reliably and a careless one
# does not, which is the shape wanted — but do not read a single run as a verdict.
# `the_end_fight_is_hard_and_winnable` pins the ratio behind that, calibrated from these
# runs. POTIONS ARE PART OF THE REFERENCE: the starting kit is ~1130 HP of healing on a
# 2648 HP party, so a measurement without them understates the party by 42%.
#
# ⚠️ **THIS NOTE USED TO CLAIM ABILITY DAMAGE IGNORES ARMOUR. IT DOES NOT.** Everything but
# a basic attack and a burn/poison DoT goes through `apply_ability_damage`, which subtracts
# `def` for physical types and `ward` for everything elemental or psychic, then applies the
# target's resistances. So attack here IS a gear dial, and these bosses' abilities answer to
# def, ward and resistance like anything else.
#
# The claim was evidenced by "an UNGEARED party lasted 26 hero-turns to a geared party's 25"
# — measured through `MELD_GEAR_TIER` while it was INERT (`flush_gear_loads` mirrored the
# empty Vault back over the dressing a tick later), so both sides of that comparison were
# undressed.
#
# RE-MEASURED with the flag working (mcp/, seed 424242, level 25, same fight at d308): the
# ungeared party lost 376 HP over 85 turns and was LOSING with a hero down; the tier-32 party
# won in 47 turns having lost 172. The same all-enemy ability landed -25/-26/-7/-13 ungeared
# and -0/-0/-7/-0 geared. Gear gates ability damage, and at that tier it can null it.
end_fight_boss_hp = 1000
end_fight_boss_atk = 210
end_fight_boss_xp = 40000
# The biggest reward spike in the game — above a Gatekeeper's 9.0. This is what buys the
# end fight its chance at a UNIQUE and a SET piece: the three insured pieces come from
# `rolled_gear`, which cannot produce either by design ("a champion must stay the better
# source of a great item"), so the spike is what makes the apex actually the apex.
end_fight_loot_mult = 14.0
# Each of the three shrugs off a DIFFERENT damage family (mind / physical / elemental), so
# no single source clears the encounter. This exists because armour is not a real defence
# against the Psyker: Foci ignore defence outright and ride Mnd, which comes from levelling
# rather than loot — four Psykers cleared the fight in 6 rounds against the intended 25 and
# took no hits at all. A ward they cannot burn through makes a MIXED party the answer without
# nerfing the class that earned its kit.
end_fight_ward_mult = 0.35        # damage of the warded family that actually lands
# …and a set piece is not a big creature: gauge slows (Gravity Vortex, Anchor, a web) can
# never take one below this share of its normal fill rate. Unclamped, a single Vortex plus an
# Anchor left each boss acting 0.3 times in the entire fight, so `end_fight_boss_atk` — the
# whole danger of the encounter — simply never happened.
end_fight_slow_floor = 0.6
end_fight_reward_pieces = 3      # insured pieces awarded for felling it
end_fight_reward_tier = 32       # tier(3200) = 32, so the reward matches the ground it fell on
undead_rite_min_tier = 4         # never shallower than this
# An Elite is a NAMED BOSS with elite_hp_mult behind it. Ungated, one can be the
# second creature a level-1 party meets — measured as a guaranteed wipe, which is
# not an encounter. The shallow ring is the on-ramp; champions wait past it.
elite_min_distance = 120         # no Elite promotion shallower than this [TUNABLE]
# A Gatekeeper is a 10x-HP wall and was gated only by `hub_safe_radius` (13 units),
# so one could stand a few paces from the hub and end a new account's first dive on
# contact. It waits until a party has had somewhere to grow into. [TUNABLE]
gatekeeper_min_distance = 300
undead_rite_minions = 4          # the retinue [TUNABLE]
undead_rite_boss_hp_mult = 3.2   # above an Elite (2.4), below a Gatekeeper (7.5)
undead_rite_boss_atk_mult = 1.45
undead_rite_boss_xp_mult = 4.0
undead_rite_minion_hp_mult = 0.6 # a rite's minions are tougher than a pack's 0.45
undead_rite_minion_atk_mult = 0.75

# THE CALL (CR-11). A pack LEADER that is losing spends its turn shouting, and the rest
# of its pack answers from the overworld — from much further out than `[ai] group_radius`,
# which is the entire point: a pack thinned by drift, by a turf war, or by the party's
# opening turns can get its bodies back, and clearing the littles first stops being a free
# line. It is priced by the only thing a creature has to spend: THE CALL IS ITS TURN, once
# a fight. Nothing here can turn a hit into a one-shot — same safety argument as the raid
# tier's cadence knobs.
#
# `hp_fraction` OR "no living minions left" arms it, because a pack fight has two shapes: a
# party that focuses the leader drops its HP, a party that clears the littles leaves it
# alone. Covering one reading only would make the call invisible against whichever line the
# player took. `radius` is deliberately far past a group radius and `max` is what stops a
# dense ring from answering as a mob — a call is reinforcements, not an avalanche. [TUNABLE]
pack_call_hp_fraction = 0.6
pack_call_radius = 22.0
pack_call_max = 3

# PACK AI: a pack should fight like a pack, which also makes clearing one a
# DECISION — break the leader and the littles rout, or clear the littles first and
# the leader stops being shielded.
pack_aura_atk_mult = 1.25        # a minion hits this much harder while its leader lives [TUNABLE]
pack_guard_per_minion = 0.08     # each living minion soaks this fraction of the leader's incoming damage [TUNABLE]
pack_guard_cap = 0.32            # …capped, so a big pack is never immune
pack_rout_atk_mult = 0.6         # a minion's attack after its leader dies [TUNABLE]
pack_rout_flees = true           # a routed minion also bolts when it drops low (structural)

# Encounter-size RAMP by distance. Group size is a deliberate curve, not a dice
# roll: the first ~150 tiles are duels while a player learns the ATB, then pairs,
# then mixed triples, then quads. `size` counts the WHOLE encounter (a leader plus
# size-1 minions); `chance` is how often a spawn in that band forms a group at all
# (the remainder stay solo, so a band still has texture); `mixed_chance` is the odds
# a given minion is a different species than its leader.
[[encounters.group_ramp]]
from_distance = 150              # duos: one leader, one minion, same species
size = 2
chance = 0.55
mixed_chance = 0.0
[[encounters.group_ramp]]
from_distance = 250              # triples, and species start mixing
size = 3
chance = 0.7
mixed_chance = 0.4
[[encounters.group_ramp]]
from_distance = 350              # quads
size = 4
chance = 0.8
mixed_chance = 0.45
[[encounters.group_ramp]]
from_distance = 500              # the deep world's baseline pack
size = 5
chance = 0.85
mixed_chance = 0.5

# Gear rarity (loot excitement). A dropped piece rolls Common → Rare → Epic →
# Legendary; higher rarity scales the stat bonus (and flavours the name). The
# encounter's loot spike (elites/gatekeepers) multiplies the rare/epic/legendary
# odds, so bosses drop the shiny stuff — capped so Common is always possible.
# [TUNABLE]
# Affixes — the loot chase (AD-1, docs/proposals/gear-identity.md §3). Past a tier
# floor a drop rolls QUALITIES instead of only bigger numbers. Which affixes exist
# is content (meld_proto::affixes::AFFIXES); these are the knobs.
[affix]
count_common = 0                 # affixes rolled on a Common drop [TUNABLE]
count_rare = 1
count_epic = 2
count_legendary = 3
count_signature_bonus = 1        # a class-signature piece rolls one extra [TUNABLE]
# EPHEMERAL pieces roll extra affixes on top of their rarity's count, which is what makes
# them the gear that DEFINES a run's build rather than merely the biggest numbers in it: an
# ephemeral legendary carries 5 lines where the insured legendary beside it carries 3, so the
# strongest synergies in the game are the ones you can only assemble for a single dive. It
# earns the size: the piece burns when you reach the city AND when the hero wearing it goes
# down, so a build hung off one is a build you can lose mid-fight. [TUNABLE]
count_ephemeral_bonus = 2
magnitude_per_tier = 1.6         # base magnitude = this x tier x the affix's own scale [TUNABLE]
magnitude_jitter = 0.25          # +/- fraction on each roll [TUNABLE]
# Tier floors per affix class: the early game stays legible (P1-3), builds bloom deep.
# How OFTEN a line of each kind is the one you draw (relative weights; `scale` above is
# how BIG it is). Filler at 1.0, the build-defining classes below it — so a synergy or a
# class keyword is a find rather than a coin flip. Measured before this existed: all 13
# reachable affixes landed on 32-34% of deep legendary pieces, i.e. `brand` (what damage
# type your attacks ARE) was exactly as common as `masterwork` (extra durability), and a
# wider roll was simply more random lines. Draws are WITHOUT REPLACEMENT, so these are the
# odds of each *slot*, and a piece never rolls the same key twice. [TUNABLE]
weight_stat = 1.0                # atk / def / spd - the filler that makes a prize feel like one
weight_quality = 0.8             # masterwork
weight_ward = 0.5                # barrier / regen / evasion / ward
weight_element = 0.3             # resist / element_power / brand
weight_keyword = 0.2             # the class-mechanic twists
weight_synergy = 0.2             # ally-conditional: the party-build lines
tier_floor_stat = 0              # +N atk/def/spd from the first drop
tier_floor_element = 3           # elemental resistance
tier_floor_ward = 4              # start-of-battle Barrier/Regen/Evasion
tier_floor_keyword = 6           # class-mechanic twists
tier_floor_synergy = 8           # ally-conditional bonuses (party builds)
# Craft quality — how well the thing is MADE rather than what it does. Early, because
# durability is an early-game pain and "this one lasts" should be a find you can have
# before you understand builds.
tier_floor_quality = 2
# How much more max durability an "of Masterwork" piece carries, as a percent, before
# the usual per-roll jitter. At 60 a masterwork piece takes 4-6 deaths against a plain
# one's 2-4. [TUNABLE]
masterwork_durability_pct = 60
resist_pct_per_tier = 4          # elemental resist % per tier, capped [TUNABLE]
resist_pct_cap = 40
# Uniques + sets: the two chase tiers above affixes. A unique only drops from a
# reward spike (elite/gatekeeper/boss) — a chase item farmable from trash is not a
# chase — and never below its tier floor.
unique_chance = 0.06             # P(a spiked drop is a unique) [TUNABLE]
unique_min_tier = 6
unique_requires_spike = true     # structural: uniques come from elites/bosses only
set_chance = 0.18                # P(a drop belongs to a set) [TUNABLE]
set_min_tier = 4

# Adventure depth (AD-2): party synergies + sequenced ability combos. WHICH combos
# and synergies exist is content (meld_proto::synergies); these are the numbers.
[adventure]
combo_window_ticks = 60          # ~6s at the 100ms tick: a primer must be cashed in fast [TUNABLE]
# FRACTIONS of each hero's own max HP, not flat points — the same rule every other
# magnitude that lands on a hero follows. Flat 3 regen was 7.5% of a level-1 hero and
# 0.6% of a level-100 one; worse, it was granted to EVERY hero and out-healed the
# Resonant's own innate regen (`resonant_regen_fraction`, 2%) by nearly 4x, so the best
# healer in the game was beaten by a passive nobody spent a turn on. Measured in play, it
# turned a standard on-ramp fight into a formality: 96 HP of party healing against 25
# points of incoming damage.
#
# Calibrated against what a SPENT TURN buys: the Keeper's Bloomfield is party-wide regen
# for a whole turn at 1.5%, and its cheapest party Barrier is 9%. A free passive should
# sit well under both.
synergy_party_barrier_fraction = 0.05  # Fortress Front: Barrier every hero opens with [TUNABLE]
synergy_party_regen_fraction = 0.008   # Blood and Balm: Regen for every hero [TUNABLE]
synergy_back_row_evasion = 8     # Covering Blink: Evasion % for back-row heroes [TUNABLE]

# THE FORGE (MS-1): crafting gear, rerolling its affixes, and repairing what a
# death chewed. Forging level is the lever — a better smith wastes less material and
# rolls closer to the top of the band.
[forge]
gear_material_cost = 4          # materials consumed to forge one piece [TUNABLE]
gear_chit_cost = 60
gear_tier_per_forging_level = 0.5  # the tier a smith can forge at, per Forging level [TUNABLE]
gear_variance = 0.35            # +/- fraction on a forged stat at Forging level 1 [TUNABLE]
gear_variance_floor = 0.08      # …shrinking to this as Forging level climbs: a master smith is consistent
gear_variance_per_level = 0.03
reroll_material_cost = 3        # materials to reroll a piece's affixes [TUNABLE]
reroll_material_per_tier = 2    # …plus this per TIER of the piece: re-drawing a deep
                                # item's affixes is a bigger job than a starter blade's,
                                # so the deeper the piece the more stock it eats [TUNABLE]
reroll_chit_cost = 90
reroll_min_forging_level = 3    # rerolling is a smith's trick, not a beginner's
repair_chit_cost_per_point = 4  # chits per point of max durability restored [TUNABLE]
repair_points_per_forging_level = 6  # how much one repair can restore, per Forging level
forge_xp_per_craft = 30         # Forging XP for a forge/reroll/repair [TUNABLE]
# The CATALYST: quench the piece in a monster part (a `trophy` material) and it
# comes out a tier past what the smith's own level can reach, rolling epic-grade
# affixes instead of rare. This is what makes a combat drop worth carrying home —
# it buys REACH, which is the one thing levelling otherwise gates. [TUNABLE]
catalyst_material_cost = 2      # trophies consumed by a catalyzed forge
catalyst_tier_bonus = 1         # tiers the catalyst adds on top of forgeable_tier
# The FIELD STATION: a smith who carries ore can raise a rough forge out in the maze,
# and then anyone standing at it can have a piece worked — the station's owner is the
# skill doing the job. Uses are finite so the city anvil stays the cheaper way to work
# in bulk, and the ore comes from the run backpack, so a field smith has to have
# gathered for it. [TUNABLE]
station_min_forging_level = 2    # the Forging level it takes to raise one
station_min_alchemy_level = 2    # …and the Alchemy level an ALEMBIC takes (the Keeper's
                                 # half of the same idea: a still you can set up in the
                                 # field and brew at) [TUNABLE]
station_ore_cost = 3             # ore from the backpack that a station is built from
station_uses = 4                 # jobs it serves before it is spent
station_radius = 3.0             # world units within which a station can be worked at
# Raising and packing up a bench TAKE TIME, as a channel: a station is a commitment you
# make in a dangerous place, not a thing you drop while running. Both are interruptible,
# and teardown hands part of the stock back — packing up is thrift, not a penalty.
station_setup_ms = 4000          # channel to raise one [TUNABLE]
station_teardown_ms = 2500       # channel to pack one up
station_teardown_refund = 1      # stock returned when you pack up a bench with jobs left
# TEMP ENHANCE: a smith can put an edge on a piece that lasts the REST OF THE RUN. It is
# never a Vault write, so it cannot be a way to launder power home — the enhancement dies
# with the dive, which is what makes it worth asking a smith for on the way in. [TUNABLE]
enhance_material_cost = 1        # refined stock one enhancement eats
enhance_chit_cost = 30
enhance_bonus_base = 2           # stat points at a wholly missed heat
enhance_bonus_per_quality = 6    # …plus this much, scaled by the heat's quality
enhance_min_forging_level = 1    # an apprentice's trick, unlike a reroll
# A set-up ALEMBIC is a place to stand as well as a place to brew: it radiates a slow
# regen field over anyone near it, and its Keeper can hand out a TONIC — the still's
# answer to the forge's edge, spread across the whole party instead of one piece, and
# lasting the same single dive. [TUNABLE]
alembic_field_radius = 7.0       # world units the regen field reaches
alembic_regen_per_sec = 0.9      # HP/sec it restores to a party standing in it
tonic_material_cost = 1          # reagents one tonic eats
tonic_chit_cost = 25
tonic_atk = 1                    # at a wholly missed cook…
tonic_def = 1
tonic_regen = 1
tonic_per_quality = 3            # …plus this much of each, scaled by the cook's quality

# SMITHING TEMPO (MS-1). Working metal is a rhythm, not a purchase: the marker sweeps
# the bar and the smith strikes on the hot bands. Quality is hits/strikes, and it is
# what decides the affix pool a re-draw rolls from and how much a repair gives back —
# so a master is someone who can hit a narrow band, not someone who clicked more. The
# same block serves the Keeper's ALEMBIC: a brew is a cook you have to take off the heat
# at the right moment, graded the same way.
# Difficulty rides the PIECE: a deeper item takes more blows, on narrower bands, at a
# faster sweep. [TUNABLE]
[tempo]
strikes_base = 3                # blows a tier-0 piece takes
strikes_per_tier = 0.5          # …plus this per tier (rounded down)
strikes_max = 8
band_width_base = 0.34          # the hot band, as a fraction of the bar, at tier 0
band_width_per_tier = 0.04      # …narrowing with the piece's tier
band_width_min = 0.09
sweep_ms_base = 1700            # one full pass of the marker at tier 0
sweep_ms_per_tier = 110         # …faster per tier
sweep_ms_min = 650
# …and it EASES with the smith: their own Forging level, and how many smiths are in the
# party. A master with a crew gets a wide band and a slow sweep; a lone apprentice
# working a deep piece gets a sliver moving fast. Difficulty is the piece MINUS the
# smiths, which is what makes bringing a second smith worth a party slot. [TUNABLE]
band_width_per_skill_level = 0.012
band_width_per_extra_hand = 0.05
sweep_ms_per_skill_level = 25   # added back to the sweep (slower = easier)
sweep_ms_per_extra_hand = 120
extra_hands_max = 3              # beyond a full party of them, nothing more helps
grace_ms = 2000                 # slack after the last sweep before the server grades
                                # whatever arrived (a smith who walks away gets that)
cook_bonus_doses = 2            # extra doses a flawless COOK yields on a brew
quality_epic = 0.999            # a flawless heat rolls the epic affix pool
quality_rare = 0.5              # …a decent one the rare pool; below that, common
repair_quality_floor = 0.5      # fraction of a repair you get for a wholly missed heat

# Potions (GR-4) and the Apothecary (EC-2). What each potion DOES is content in
# `meld_proto::consumables`; these are its numbers, plus the chit price of the
# lowest-tier stock one NPC keeps on the shelf.
# SMITHWRIGHT + KEEPER kit coefficients (MS-1's two profession classes). Both are
# support-shaped: a Smithwright buys the party time and a Keeper keeps it alive, so the
# damage numbers are deliberately modest and the durations are where the value is.
[smithwright]
hammer_mult = 1.35               # Hammer Fall: heavy, staggering blow [TUNABLE]
hammer_gauge_drain = 0.25        # …and the gauge it knocks off the target
quench_barrier_fraction = 0.22   # Quench: Barrier as a fraction of own max HP
bulwark_barrier_fraction = 0.14  # Plant the Bulwark: the same, for EVERY ally
# A FRACTION OF THE ALLY'S OWN ATTACK, not flat points — hero attack runs 12 at level 1 to
# ~309 at level 100, so a flat +4 was worth a third of a hero early and 1.3% late, and
# Anvil Chorus was a level-75 ability worth one percent.
temper_atk_fraction = 0.15       # Tempering Blow: +this share of an ally's attack, for the fight
slag_mult = 0.7                  # Slag Spray: all-enemy, armour-ignoring
# Trimmed under the Resonant's party heals for the same reason the Keeper's are: a smith
# out-healing the healer made the Resonant optional. See `the_healer_is_the_best_healer`.
forge_heal_fraction = 0.12       # The One True Forge: party heal as a fraction of max HP
forge_barrier_fraction = 0.14    # …and the Barrier that comes with it
# The deep rungs (49, 100). A Smithwright's value is the party's numbers, so both scale
# what everyone else does rather than adding a bigger swing of its own.
chorus_atk_fraction = 0.12       # Anvil Chorus: Tempering Blow, for EVERY ally
great_work_heal_fraction = 0.16  # The Great Work (100): party heal…
great_work_barrier_fraction = 0.18 # …Barrier…
great_work_atk_fraction = 0.18   # …and the attack that outlasts both, for the fight

[keeper]
thornlash_mult = 0.85            # Thornlash: modest damage [TUNABLE]
thornlash_gauge_drain = 0.2      # …and the gauge the thorns cost it
# EVERY MAGNITUDE HERE IS A FRACTION OF THE RECIPIENT'S MAX HP, not flat points. Flat was
# the Keeper's undoing: a hero runs 40 max HP at level 1 and ~535 at level 100, so a flat
# 14-point Poultice was a third of a hero at 5 and 2.6% of one at 100 — the class stopped
# being a healer somewhere around level 30 while every other mender scaled.
#
# THE KEEPER MUST NEVER OUT-HEAL THE RESONANT. The Resonant is the dedicated healer and
# pays for its heals out of its own HP; the Keeper's are free, so every value here sits
# strictly under the Resonant's at a comparable rung. Held by
# `the_healer_is_the_best_healer`, which reads both ladders off balance rather than
# trusting this paragraph.
poultice_heal_fraction = 0.14    # Poultice: heal now…
poultice_regen_fraction = 0.02   # …and Regen a turn after
bloomfield_regen_fraction = 0.015 # Bloomfield: Regen a turn for the whole party
root_snare_mult = 0.9            # Root Snare: damage…
root_snare_gauge_drain = 0.6     # …and a long wait for its turn
draught_barrier_fraction = 0.16  # Vital Draught: Barrier…
draught_regen_fraction = 0.025   # …with Regen a turn
gift_heal_fraction = 0.10        # Terra's Gift: party heal…
gift_barrier_fraction = 0.09     # …Barrier…
gift_gauge = 0.25                # …and a push on every ally's gauge
# The deep rungs (49, 100). Thorn Grove is the order's ONLY all-enemy answer, so it is
# priced as control (the drain) with damage attached rather than the reverse.
thorn_grove_mult = 0.6           # Thorn Grove (49): Mnd damage to EVERY enemy…
thorn_grove_gauge_drain = 0.35   # …and the gauge it costs each of them
world_tree_heal_fraction = 0.14  # World Tree (100): party heal…
world_tree_barrier_fraction = 0.12 # …Barrier…
world_tree_regen_fraction = 0.02 # …and Regen a turn, all three at once

# "EQUIP BEST" weights: how much each class wants attack / defence / speed out of a piece
# of gear. Gear only carries those three bonuses, so this is the whole scoring axis — and a
# flat sum would be wrong for most of the roster: a Psyker's damage rides Mnd, so `atk` on a
# staff is nearly dead weight to it, while a Phoenix Guard would rather have the armour than
# anything. Highest weighted score per slot wins. [TUNABLE]
[equip_best]
explorer = [1.0, 0.9, 0.7]        # tempo and standing up: wants a bit of everything
hunter = [1.3, 0.7, 0.6]          # its damage is the point
psyker = [0.3, 0.9, 1.0]          # atk does nothing for a Focus; speed casts sooner
resonant = [0.3, 1.0, 1.1]        # act sooner, survive longer; its heals ride Mnd
shifter = [1.1, 0.4, 1.3]         # fast and fragile, and dodge rides Dex
phoenix_guard = [0.8, 1.4, 0.2]   # the wall. Slow on purpose
smithwright = [1.0, 1.2, 0.4]     # front line that props others up
keeper = [0.3, 1.0, 1.0]          # a mender: its damage rides Mnd too

# What a piece of armour's WEIGHT does about each damage type (AD/GR). `meld-proto`'s
# `weight_profile` owns the SHAPE — which types a weight resists and which it takes worse —
# and this owns the size of one step, because a coefficient is balance's.
#
# These are PER PIECE, and `fold_damage_modifiers` adds the deltas across everything worn
# (1 + sum of (m-1), clamped 0..2). A full four-piece plate set lands at 0.76 against a slash
# and 1.12 against a blunt; a robe at 1.36 against everything physical.
#
# **Sized by the EARLY game, not the late one.** At 0.045 a robe took 1.54x physical, and the
# default party (two robe-wearers) started losing its first fights — `field_item`'s bot died
# on the on-ramp rather than living long enough to drink a potion. A level-1 caster has 34 HP
# and no margin at all, so the step that reads as flavour at level 100 is lethal at level 1.
# Raise it and you re-break the on-ramp; raise it a lot and a full set floors out at 0.0/2.0,
# where a resistance stops being a trade-off and becomes a switch. [TUNABLE]
# What an AFFLICTION does to you on the ROAD. Afflictions no longer expire, so one you caught
# in a fight follows you out of it — and out here it has to be felt, or "you are poisoned" is a
# word on a HUD.
#
# Venom is per STEP rather than per second, so standing still to wait it out does nothing (there
# is no waiting it out — it needs a cure) but a long march with poison in you is a real cost.
# [TUNABLE]
[affliction]
venom_hp_per_step = 1            # HP each poisoned/burning hero loses per movement input
venom_steps_per_tick = 12        # …once every this many inputs, so a march bleeds gradually
bindings_move_mult = 0.55        # webbed/chilled/bound: how much of your speed you keep
# PARALYSIS is the one affliction that takes the turn itself, so it gets a way out that is not
# only a cure: each turn the held fighter tries to break it, on WILL — the attribute that
# already answers "how much of you is yours" (it buys HP and physical defence). Small on
# purpose: it is a slim hope, not a reason to skip the cure, and the cap stops a high-Wll
# Phoenix Guard shrugging paralysis off outright. [TUNABLE]
paralysis_break_base = 0.08      # chance per turn before Will
paralysis_break_per_wll = 0.004  # …plus this per point of Will
paralysis_break_cap = 0.45       # …never better than this

[armor_resist]
step = 0.03
# A creature's own `ward` — its elemental/psychic resistance — as a fraction of its physical
# `def`. Creatures have no Mnd to grow it from, so it rides the defence curve instead.
#
# Deliberately BELOW 1.0: casting has to stay the answer to something armoured, or the
# Psyker's whole identity ("Foci ignore defence and ride Mnd") is deleted by giving every
# creature a magic shield. At 0.6 a spell still beats plate on a golem, just not for free.
# [TUNABLE]
creature_ward_fraction = 0.6
# A creature's own profile (`creature_damage_modifiers`) is authored in absolute multipliers
# rather than steps, because a creature is one thing wearing its own hide — there is nothing
# to stack. Both sides resolve through the same `modifier_for`, so a hero's plate and a magma
# golem's crust are the same mechanic asked the same question.

[consumable]
# THROWN (the all-enemy tier). A share of the thrower's own attack, landed on every enemy at
# once. Well under 1.0 because it hits the whole encounter: total output is `mult x targets`,
# so at a pack of eight even a third of a swing is more than a swing. The COUNT in the pouch
# is what prices it, not the number per target.
thrown_atk_mult = 0.35
barrier_amount = 18             # Bulwark Tonic: Barrier granted [TUNABLE]
regen_amount = 6                # Mending Draught: Regen per turn [TUNABLE]
evasion_pct = 20                # Ghostdust: Evasion percentage points [TUNABLE]
adrenaline_amount = 6           # Fury Philtre: Adrenaline banked [TUNABLE]
revive_hp_fraction = 0.35       # Waking Salt: a revived hero stands at this much HP [TUNABLE]
insight_mote_xp = 250           # Insight Mote: XP granted to the drinker [TUNABLE]
world_xp_item_chance = 0.05     # P(a felled creature drops an Insight Mote) [TUNABLE]
world_revive_item_chance = 0.04 # P(a felled creature drops a Waking Salt) [TUNABLE]
# Apothecary shelf prices, in chits. Deliberately cheap: the point of the shop is
# that a player who died with nothing can still walk back out equipped.
price_bloom_salve = 25
price_bulwark_tonic = 40
price_mending_draught = 35
price_town_portal = 60
price_markup_per_tier = 2.5     # each shop tier above 0 costs this much more [TUNABLE]
# Each step up a potion's own effect ladder (ConsumableDef::potency) multiplies its
# magnitude by this. Step 0 is the standard dose, so the trophy line can sit above
# the reagent line without moving any number a player already knows. [TUNABLE]
potency_per_step = 1.6

# THE REQUISITION (EC-2): Silas's off-the-books counter at the Foundry, where chits buy
# the plainest gear in the game (tier 0, common, no affixes, `normal` insurance). Priced
# so it is a floor to stand on after a bad death, never a shortcut past the loot chase —
# a forged or found piece must always beat what a clerk will sell you. [TUNABLE]
[requisition]
weapon_price = 220        # main_hand / off_hand
armor_price = 180         # head / chest / legs
accessory_price = 140

[gear_rarity]
rare_weight = 0.28               # base P(Rare) on a standard drop
epic_weight = 0.09
legendary_weight = 0.02
rarity_shift_per_2_tiers = 0.10  # spec §4: every 2 tiers, non-common weights +10%, common -10% [TUNABLE]
rare_mult = 1.5                  # stat-bonus multiplier vs a Common piece
epic_mult = 2.3
legendary_mult = 3.6
# Class-specific gear (each class has its own named 20-item catalog per slot,
# meld-world::CLASS_KEYS/class_slot_noun) plus one signature item per
# class+slot (meld-world::class_signature_name) — much stronger, much rarer.
class_signature_chance = 0.04    # +chance a drop is the class's signature item
class_signature_min_tier = 8     # signature items never appear before this tier
class_signature_mult = 1.6       # stat-bonus multiplier, stacks with rarity

[meld]
# Meld-skill progression. Simple linear curve for the slice; the real per-skill
# curves + recipe XP are content tables. [TUNABLE]
xp_per_level = 100
alchemy_xp_per_extracted_stack = 15   # extracting plants/monster parts (GDD §4.1)
forging_xp_per_craft = 25             # successful craft (GDD §4.1)
mercantile_xp_per_sale = 8            # selling a material stack to the Broker (GDD §4.1)

# THE BROKER (MS-1 / EC-2): the NPC that BUYS materials, so nothing you carry home
# is ever unspendable. Priced as a FLOOR, not an income — crafting with a material
# must always beat selling it, or the crafting economy never starts. Chits minted
# here are economy source S3 (docs/behaviors/economy.md).
[material]
sale_base_chits = 5              # what a tier-0 (forest) material fetches [TUNABLE]
sale_growth_per_tier = 1.7       # each biome band deeper is worth this much more
sale_trophy_mult = 1.6           # a monster part costs a fight, not a walk
sale_refined_mult = 2.4          # refined stock has a Smelter's labour in it (2 raw → 1)
sale_haggle_pct_per_level = 2.0  # Mercantile level improves the price by this %/level…
sale_haggle_max_pct = 60.0       # …capped here, so a master haggler is better, not rich

[combat_math]
# Damage = max(1, round(atk * stat_mult_attacker - def)). Content-defined
# formula; coefficients here. mlevel/stat_mult per world scaling.
min_damage = 1
# Armour can never absorb ALL of a hit: a blow always lands for at least this
# fraction of the attacker's scaled attack.
#
# Without this floor, defence — which is SUBTRACTIVE and grows about +1 per level —
# outruns creature attack, which only grows with distance. A level-25 hero has 30
# defence and 292 HP, so every creature out to roughly distance 1100 was doing
# `min_damage` (1) and needed 292 hits to kill them. The tutorial-easy phase never
# ended. The floor makes depth dangerous again without touching hero growth or the
# distance curve. [TUNABLE]
damage_floor_fraction = 0.25

[world_scaling]
tier_divisor = 100.0             # tier(d) = floor(d/100)
mlevel_divisor = 12.5            # mlevel(d) = max(1, round(d/12.5))
stat_mult_base_divisor = 500.0   # (1 + d/500)^exp
# HP rides the SAME basis gear power does — `tier(d)` — so the two cannot drift.
#
# Gear attack is linear in tier (`gear_atk_per_tier` x 7 slots ~= 21 x tier), while
# every exponential curve either undershoots early or explodes late. Putting creature
# HP on `1 + hp_per_tier x tier` makes the ratio of party damage to creature health
# constant BY CONSTRUCTION: a correctly geared party spends roughly the same number of
# rounds per fight at every depth, and an under-geared one does not.
#
# This is the CANON §B change: `stat_mult` no longer drives HP. It still drives
# ATTACK, because attack is opposed by hero HP and defence, which grow with LEVEL —
# a different thing, wanting a different curve. [TUNABLE]
hp_per_tier = 5.4

# The shallow-ring ON-RAMP. Every other curve above multiplies a creature's base
# stats, and near the hub they all sit at ~1.0 — so a new account's first fight was
# just whatever `[creature.<kind>]` happened to say. Measured, a level-1 solo lost
# better than half of its opening fights in the randomized world. This ramps creature
# power from `onboarding_floor` at the hub to full strength at `onboarding_distance`,
# which is what makes "distance is the difficulty axis" true at the shallow end too.
# Past `onboarding_distance` it is exactly 1.0 and changes nothing. [TUNABLE]
onboarding_floor = 0.6
onboarding_distance = 200

# MELDWORLD is meant to kill you until you have the right gear. At the old 1.25 an
# ungeared level-25 hero needed 42 hits to die at distance 1000 and 14 at 2000 —
# the tutorial-easy phase never ended, so nothing ever made you want to come back
# better equipped. At 2.0 the shallow ring is still gentle (73 hits at d=300, which
# is the one-hero tutorial era) and it turns lethal fast: 9 hits at d=1000, 3 at
# 2000, 1 at 4000.
#
# Known gap this does NOT close: gear attack grows LINEARLY with distance
# (gear_atk_per_tier x 7 slots ~= 0.21 x d) while creature stats grow as
# (1 + d/500)^exp. Different curve shapes, so no single exponent makes them track —
# a fully geared hero still one-shots ordinary creatures. Closing that means putting
# creature stats and gear power on the SAME tier basis, which is a CANON §B change.
stat_mult_exp = 2.0
# Armour rides its OWN, gentler curve. Defence subtracts from damage rather than
# multiplying it, so scaling it as fast as attack/HP makes deep creatures immune to
# physical hits (damage floors at `min_damage`) — while leaving it flat, as it was,
# means nothing out there wears armour and every armour-piercing ability (Backstab,
# the Psyker's armour-ignoring Foci) is a selling point with nothing to sell against.
# [TUNABLE]
def_mult_exp = 0.7
xp_distance_exp = 1.5            # spec §4: xp = floor(base_xp * (1 + d/500)^1.5) [TUNABLE]
red_chest_floor_distance = 300  # spec §4: no gear drops shallower than d=300 [TUNABLE]

# Procedural area generation (world-generation.md subset). A MazeInstance is a
# seeded chain of biome "areas" marching east from the Center Hub. Each area has
# its own length; lengths trend larger with depth (area_length_growth) plus a
# per-area jitter, so no two areas are the same size and later ones are bigger
# on average. Monsters are spaced along the corridor; deeper (longer) areas hold
# more. All [TUNABLE] — structure is code, coefficients here (working agreement #2).
[worldgen]
area_count = 8                   # how many areas to pre-generate for the instance
# Dungeons (WG-1): every Nth procedural (non-tutorial) section is a "dungeon" —
# rooms divided by walls with a single door on the clear path (connectivity is
# guaranteed by construction, like a biome seam), packed denser with creatures and
# ending in a guaranteed loot chest. Rendered by the normal obstacle/creature path.
dungeon_every = 4                # 0 disables dungeons; else every Nth section (i>0) is one
dungeon_rooms = 3                # rooms per dungeon (this many − 1 internal divider walls)
dungeon_creature_mult = 1.9      # creature density multiplier inside a dungeon
dungeon_wall_radius = 1.1        # radius of each obstacle in a divider wall
dungeon_door_half = 2.6          # half-width of the door gap a divider leaves on the path
# Authored dungeons (WG-1 full / DG-3): as the world streams, each non-tutorial
# section has this chance to also host a hand-designed dungeon ENTRANCE (drawn from
# its biome's authored pool). 0 disables. Depth-step bumps the effective distance
# (difficulty + loot) per dungeon floor descended.
dungeon_spawn_chance = 0.12      # per streamed non-tutorial section (DG-3b)
# No dungeon door within this distance of the hub. A dungeon is a committed space
# that takes no Town Portal, so one sitting where you can see it from the city gate
# is an invitation a new player cannot read — and two of them at the doorstep reads
# as the whole game being dungeons. [TUNABLE]
dungeon_min_distance = 250.0
dungeon_depth_level_step = 25    # effective-distance added per floor descended (DG-3/DG-5)
dungeon_trap_damage = 30         # base HP a sprung dungeon trap deals; scaled up by depth (DG-3b/DG-4)
# WG-4: crossing this far WEST of the hub (behind spawn) returns you to Last City —
# the safe anchor is always just to the west. Negative = behind the origin.
# ⚠️ MUST stay outside `coast::NECK_REACH`, or the peninsula is invisible. It was -20
# against a neck of 34, so a player walking west was handed to Last City FOURTEEN UNITS
# BEFORE the sea opened — the coastline was real, tested, and unreachable. Now the walk
# west crosses the neck, the sea opens on both flanks, and the last stretch is a shore you
# walk along before the city takes you. `coast::RETURN_BORDER_REACH` mirrors this value and
# asserts the relationship at compile time.
west_return_border = -46.0     # walk this far west (over the neck, along the shore) to the city WALL+GATE
base_area_length = 20.0          # tiles: length of the first (shallowest) area
area_length_growth = 7.0         # each successive area is ~this much longer on avg
area_length_jitter = 0.35        # ± fraction applied to each area's length
monster_spacing = 6.5            # avg tiles between creatures along the corridor
monster_spacing_jitter = 0.45    # ± fraction on each gap
lateral_jitter = 0.4             # creature y offset from the corridor centre-line
                                 # (kept < touch_radius so an east walk still meets it)
first_monster_x = 8.0            # the single tutorial creature (area 0) sits here
first_area_portal_gap = 6.0      # area 0's portal is this far past that creature (→ x=14)
portal_setback = 3.0             # a portal sits this many tiles before an area's end
world_margin = 10.0              # walkable distance past the final portal
lateral_half_extent = 28.0       # ±y half-height of the play area — tall enough to
                                 # scroll north/south and explore, not a thin lane
# Creatures no longer hug the centre line: from area 1 on they scatter across ±y
# so the map feels populated in every direction (area 0 stays on the line for the
# deterministic tutorial). Kept a touch inside lateral_half_extent.
creature_lateral_spread = 22.0   # ± y range creatures spawn across (areas ≥ 1)
# `monster_spacing` places one creature per gap across ONE corridor's worth of width, so
# the DESIGNED density is 1/(monster_spacing · 2·lateral_half_extent) ≈ 0.0028 per unit² —
# a creature every ~19 tiles in any direction. The WG-4 fan then bends that fixed width
# into an arc that grows with radius, which silently threw the intent away: at r=230 the
# same handful of creatures is smeared over ~1400 units of arc, one per ~91 tiles, and you
# can cross a whole section meeting nothing. So the corridor is walked once per
# corridor-width of arc, restoring the flat-corridor density. CAPPED, because the true
# stretch passes 30× in a world that streams outward forever and every creature is a live
# roaming entity the sim steps every tick: 24 holds the designed density out to about
# r=230 (the whole pre-generated world) and thins gently past it. 1.0 = off (the old
# thinning behaviour, kept so the test for it can prove the bug). [TUNABLE]
creature_radial_lane_cap = 24.0   # max corridor walks per section (× the creature count)
# Keep a creature-free ring around the Center Hub in the SPAWN section only, so a
# just-spawned player isn't instantly aggro'd into a fight before they can orient.
# MUST stay > [ai] aggro_radius (11.0): a creature's hub-distance equals its corridor-x
# in the radial world, so any creature placed closer than aggro_radius would chase the
# stationary spawn on the first tick.
hub_safe_radius = 13.0           # spawn-section creatures start this far out from the hub
# Harvestable resource nodes scattered through each area (biome-specific kinds).
resources_per_area = 3           # avg nodes per area
resource_lateral_spread = 22.0   # ± y range nodes scatter across

# Biome terrain: impassable obstacles (trees/cliffs/water/…) scattered per area so
# the map has real geography. A meandering CLEAR PATH is carved from the hub to the
# deep portal — obstacles never intrude within `path_clear_radius` of it, so a route
# to the exit is ALWAYS feasible. Area 0 (tutorial) stays obstacle-free. [TUNABLE]
obstacles_per_area = 14          # avg impassable features per area (areas ≥ 1)
# Every biome is a DENSE maze: procedural sections pack this multiple of
# `obstacles_per_area` EXTRA props into the play area (only the clear path + branch
# detours stay open), on a separate rng stream so world determinism is unchanged.
# Each biome has its OWN fill density so it FEELS distinct: forest is a dense wood,
# desert is open (a few cacti), Ashfall is a dense rocky mountain-pass, mire a choked
# swamp, tundra sparse. `maze_obstacle_mult` is the fallback for unlisted biomes.
# `biome_transition_width` tapers the density near a section's edges toward the
# neighbouring section's density, so a forest visibly THINS as it gives way to desert
# and the rock THICKENS as it gives way to Ashfall (matching the ground cross-fade).
# [TUNABLE]
# FIELD and FOREST are the same ground with different tree counts, and that contrast is
# the point: the field is grassland you can see across, the forest is a wood you can't.
# They share fauna, flora and ground texture, so the only thing telling them apart is how
# much of the view is trunk.
field_obstacle_mult = 1.3        # open grassland — trees in the distance, not around you
forest_obstacle_mult = 7.0       # a THICK wood — a real maze of trees, only the trail is open
desert_obstacle_mult = 0.8       # open desert — a scattering of cacti (the breather biome)
ashfall_obstacle_mult = 6.0      # a choked volcanic mountain-pass maze of rock
tundra_obstacle_mult = 1.6       # sparse frozen spires
mire_obstacle_mult = 7.5         # MOSTLY water: the swamp is a flooded maze, land is the trail
maze_obstacle_mult = 2.0         # fallback for any unlisted biome
# Radial density compensation: the WG-4 fan bends the fixed-width corridor into an arc
# that widens with radius, so a per-area obstacle count spreads ever thinner at depth (a
# deep area is a huge annular sector — the maze reads as an open field with a few rocks).
# Scale each area's obstacle count by how much its arc stretches vs the corridor width,
# so density-per-tile stays roughly constant with depth. Capped so the deepest areas
# don't explode the obstacle count (wire size + client draw calls). 1.0 = off (old
# behaviour). [TUNABLE]
# ⚠️ THE FORMULA THIS CONSTANT CAPS CHANGED UNDER IT. It used to cap the ARC stretch
# alone; `maze_fill_scale` now multiplies that by the section's THICKNESS ratio too (a
# per-section count spread over a section that grows from 13 to 184 units thick was the
# second, wholly uncompensated thinning axis). So the same 24 is a much tighter cap than
# its old comment claimed — it held the designed density out to about r=226 against the
# one-axis formula, and binds by r≈90 against the real two-axis stretch.
#
# MEASURED, seed 424242, biome PINNED to forest (so this is the compensation and not the
# per-seed biome lottery), streamed to d1300. Density is obstacles per 1000 u² with the
# mean prop spacing in tiles beside it — the quantity a player experiences, since a wood
# has trunks a few tiles apart and a plain has them fifty. `ms/tick` is `step_creatures`
# and `stream ms` is ONE deep section entering through `ensure_frontier`. Both best-of-N
# in release, because this box is shared and single-shot timings here are noise.
#
#   cap |   props | d 40-100  | d 400-700  | d 900-1200 | ms/tick | stream ms
#     1 |     995 | 1.65 (12) | 0.17  (38) | 0.11  (47) |    12.3 |     50   ← the bug
#    24 |  27,451 | 27.4  (3) | 5.89   (7) | 2.83   (9) |    14.8 |    181   ← here
#    60 |  66,081 | 27.4  (3) | 14.7   (4) | 7.05   (6) |    17.5 |    372
#   120 | 122,652 | 27.4  (3) | 29.3   (3) | 14.1   (4) |    22.1 |    652
#
# ⚠️ HELD AT 24, and the binding reason is the last column, not the density argument.
# `ensure_frontier` runs INSIDE the authoritative tick (`game.rs`), so streaming one deep
# section is already a **181 ms stall on a 100 ms tick** — over budget by 1.8x whenever a
# player walks into new ground, before anything here is touched. 60 makes that 372 ms and
# 120 makes it 652 ms. (World GENERATION is not the problem: best-of-5 at cap 24 is
# unchanged from before these fixes, ~1.2 s against ~1.8 s, inside the noise.) Raising
# this is therefore gated on that stall coming off the loop — `SC-2`'s sim/IO split and
# `CR-4`'s bounded tick cost.
#
# And it is the WRONG lever regardless: the fill is spread uniformly across a ring whose
# arc is ~7,000 units at r=1200, almost none of which any player can reach. Concentrating
# the SAME budget along the route network buys the density at no extra count at all. See
# `WG-6` in docs/ROADMAP.md and docs/proposals/world-shape-and-exploration.md. [TUNABLE]
maze_radial_scale_cap = 24.0     # max × `maze_fill_scale` can multiply an area's obstacle count
biome_transition_width = 30.0    # world units over which density blends at a section edge
obstacle_min_radius = 1.1        # smallest feature (a lone tree/rock) — chunky so fill reads as walls
obstacle_max_radius = 2.8        # largest feature (a cliff/boulder)
# WATER GETS ITS OWN RANGE, because a body of water has to be a BODY. Sharing the prop
# range above made every pond a puddle 2-5 units across, and once the client was corrected
# to draw water no wider than it BLOCKS (you could previously stand inside a visible lake)
# they became almost invisible. Inflating water on the client alone is not an option — that
# is exactly what left walkable ground inside the water and put a character underground.
#
# ⚠️ Bounded on purpose: `BlockField` sizes its collision cell from the LARGEST radius in
# the world, so this widens the grid for every prop in the game. Measured with one big body
# parked where it blocked nothing — r=30 free, r=80 +14%, r=150 +63% on the creature tick —
# so staying under ~12 keeps it in the free band while still reading as a lake. [TUNABLE]
water_min_radius = 4.5
water_max_radius = 10.0
path_clear_radius = 1.9          # half-width of the guaranteed route's slit. NARROW (was a 4.0 "highway" that read as a corridor) — just wide enough to pass, so the backbone is one trail among the web, not an obvious cleared lane. A route always EXISTS; you have to find it.
path_meander = 18.0              # how far ±y the clear path wanders between areas
web_trails_per_area = 5.0        # extra WEB trails woven through each section (branches/loops/spurs) so the overworld is an interconnected maze of routes, not one lane (narrow slits — the dense terrain stays the walls)
player_radius = 0.5              # the avatar's collision radius vs obstacles

# Verticality: raised terraces joined to the ground by connectors (ladders/ropes/
# slopes, now weighted toward slopes/ramps). SIDE terraces are optional detours kept
# OUT of the clear-path tube (grind pockets + treasure). The CLEAR PATH itself also
# climbs: `path_climb_chance` sections raise a mid-segment plateau the route crosses
# via guaranteed ramps, with the endpoints staying on level 0 so extraction is always
# feasible. Cliffs are impassable; the only way up is a connector. All [TUNABLE].
terraces_per_area = 0.0          # discrete blocky terraces retired — the continuous heightmap (client terrain_height) is the new natural elevation (Phase A). Peak rewards + slope-walking return via the heightmap in Phase B/C.
max_level = 0                    # no discrete cliffs; elevation is the smooth heightmap now
# WG-4: the generated corridor is bent into a radial ARC of this many degrees around
# the hub — the world fans out from the Center Hub, leaving the western gap for Last
# City. `x` becomes radius (distance = difficulty, unchanged), lateral `y` becomes angle.
#
# ⚠️ WIDENED FROM 340° (a 20° gap) TO 300° (a 60° gap), because a PENINSULA IS NOT
# EXPRESSIBLE AT 340°. The gap's half-width is `r · tan(gap_half)`, so at 340° it is
# 30·tan(10°) ≈ **5.3 units** at r=30: the fan came around to within a few units of due
# west and there was simply no room for a sea beside the neck. At 300° the same point has
# 17.3 units, and the channel beside the spit is guaranteed by construction
# (`coast::CHANNEL_LAND_SHARE`) rather than by this number.
#
# What it costs: the world loses 12% of its angular extent, so a ring holds proportionally
# fewer creatures and props — but DENSITY per unit area is preserved, because
# `maze_fill_scale`/`creature_radial_lane_cap` compensate against the arc. It is in fact a
# small density WIN at depth: a narrower fan means less arc-stretch, so the compensation
# cap binds later. Nothing currently draws a player sideways, so the lost lateral room is
# the cheapest thing in the world to spend. [TUNABLE]
radial_arc_degrees = 300.0
terrace_min_size = 6.0           # smallest terrace footprint side (tiles)
terrace_max_size = 14.0          # largest terrace footprint side (tiles)
terrain_cell = 2.0               # elevation-grid resolution (tiles per cell)
connector_radius = 2.2           # reach around a connector that permits a level change
stream_lookahead = 60.0          # generate new sections this far ahead of the frontier
path_climb_chance = 0.6          # chance a section's clear path climbs a plateau (0..1)
chest_terrace_chance = 0.5       # chance a section's chest sits atop a terrace (0..1)
peak_boss_chance = 0.5           # when the path climbs a summit, chance a gate-boss guards the top instead of a guaranteed treasure chest (0..1)
summit_min_height = 7.0          # min world terrain height a clear-path crest must reach to earn a summit reward (heightmap #3); filters flat sections
peak_radius = 26.0               # world-radius of an authored CLIMBABLE landmark mountain (#3); its height = radius * PEAK_MAX_ASPECT * ~0.9 so the dome stays walkable (you climb it) while reading as a real peak
peak_min_distance = 45.0         # nearest hub distance an authored peak may spawn (keeps big domes out of the tight near-hub rings)

# Content-ish stats per creature, keyed by content id. Bases are pre-scale; the
# world multiplies each by stat_mult(distance) at spawn, so the SAME base grows
# menacing with depth. Forest bases are tuned so a solo explorer can win the first
# fight with tension; deeper biomes lean tankier / faster / harder-hitting. All
# [TUNABLE] — pure balance. Biome→creature assignment is structural (in code).
#
# --- Forest (d 0–100) ---
# Creature AI (overworld movement + encounter grouping). All [TUNABLE].
[ai]
# CR-9 creature targeting: deeper creatures are smarter ON AVERAGE. Below the floor every
# ordinary spawn fights on its kind's own nature; past it a share rolls into a tactical
# profile (hunting the back rank, or converging on one mark), and the share climbs with
# level to a ceiling. Elites/Gatekeepers/bosses are promoted regardless — a champion is
# smarter than its escort. Rolled off the creature's own id, so the same creature in the
# same fight always thinks the same way.
smart_level_floor = 8            # creature level below which nobody is upgraded
smart_chance_base = 0.10         # share upgraded at the floor…
smart_chance_per_level = 0.012   # …climbing per level above it…
smart_chance_cap = 0.55          # …and never past this
# A gang-up mark is re-picked this often (per attacking turn) so a pack can switch to a
# better target mid-fight rather than committing to one hero until it dies.
gang_switch_chance = 0.15
wander_speed = 1.6            # tiles/sec for passive/idle drifting near home
# A WANDER DESTINATION HAS TO OUTLIVE THE TICK THAT PICKED IT. The destination used to
# be re-rolled every 100 ms tick, so a creature chased a point that teleported around
# its leash faster than it could walk: measured over 30 s, 47.8 tiles of path walked for
# 0.87 tiles of net displacement, never more than 1.93 tiles from its start. A leg is
# bounded by TIME as well as arrival, because a destination can walk a creature into a
# rock and the mover just stops there. [TUNABLE]
wander_leg_seconds = 6.0      # seconds committed to one destination before repicking
wander_arrive_radius = 1.2    # close enough — take the next leg rather than jitter through it
wander_pause_chance = 0.45    # chance a finished leg is followed by standing still…
wander_pause_seconds = 3.0    # …for this long, jittered ±50% (grazing, not machinery)
chase_speed = 4.2            # tiles/sec when hunting a player
aggro_radius = 11.0          # aggressive creatures chase players within this range
territorial_aggro_radius = 5.0  # territorial creatures only chase when this close
leash_radius = 9.0           # how far a creature wanders from its spawn (home)
group_radius = 6.5           # creatures within this of the one you touch join the fight
flee_hp_fraction = 0.3       # `flees` creatures bolt from battle below this HP fraction
join_radius = 9.0            # a teammate this close to an ongoing fight may opt in to join it
# SOC-3: you can SEE further than you can reach. Watching is free and commits nothing,
# so the radius that offers it is wider than the one that lets you step in — and wide
# enough that reading a fight does not mean standing in the middle of it.
watch_radius = 16.0          # a player this close to a fight (or a creature clash) may watch it
# CR-2: a wound has to CLOSE — otherwise the world is strip-minable by attrition (walk a
# ring, chip everything, come home) — but slowly, or a creature you found halfway dead is
# back to full before you reach it. At 0.01 a half-dead creature is whole again in ~50s,
# which is a window you can actually run across. Suspended while it is clashing or in a
# battle: nothing mends while it is still being hit.
creature_regen_fraction_per_sec = 0.01
# CR-2: a clash is a cadence of blows, not a continuous state. Without a grace period the
# ⚔ marker would strobe between swings and a watcher would be dropped every 0.85s.
clash_linger_seconds = 3.0   # a clash stays live this long after its last landed blow
skirmish_aggro_radius = 6.5  # hostile-faction creatures hunt each other within this range
skirmish_attack_range = 1.7  # ... and trade blows once this close (overworld skirmish)
skirmish_attack_interval = 0.85 # seconds between a creature's overworld blows
loot_pickup_radius = 1.9     # a player auto-collects ground loot dropped within this range

# Overworld class perks ("party sense"): each hero class, when present in the
# party, grants a distinct overworld utility whose tier scales with the shared
# run_level. Per-hero level is uniform, so thresholds are run-level values.
# [TUNABLE] — see meld-balance::Perks and the CANON class taxonomy.
[perks]
# Explorer — the lantern, and the MAP. "A world known": the order that maps and
# reclaims the world is the one that carries the minimap (docs/lore/factions.md).
explorer_glow_base = 180000.0       # avatar PointLight intensity at run level 1
explorer_glow_per_level = 30000.0   # brighter (and, client-side, wider) per run level
explorer_map_at = 1                 # run level that unlocks the minimap (+ mob/portal dots)
explorer_map_chests_at = 3          # + treasure-chest dots
explorer_map_harvest_at = 5         # + harvestable (resource-node) dots
explorer_map_radius_base = 30.0     # world-units the minimap covers at unlock
explorer_map_radius_per_level = 2.0
# Hunter — the predator's eye. Knowing your prey before you commit is the guild's
# entire trade, so the creature intel is theirs.
hunter_intel_level_at = 1           # run level to reveal a mob's LEVEL over its head
hunter_intel_hp_at = 3              # run level to also reveal a mob's HP bar
hunter_intel_atb_at = 6             # run level to reveal enemy ATB gauges in battle
# …and threat sense, which is the same trade seen from further off: what is dangerous
# before it is in reach. It sat with the Psyker, whose fantasy is manifestations rather
# than fieldcraft, and duplicated the intel lane above while capping out at run level 3.
hunter_threat_elites_at = 1         # run level to mark elite/gatekeeper mobs
hunter_threat_aggro_at = 3          # + mark aggressive mobs
hunter_reveal_base = 22.0           # extended mob interest radius (tiles) at unlock
hunter_reveal_per_level = 2.0
# Shifter — Shift-sense: where the doors are, and which loot is worth carrying.
shifter_dungeon_at = 1              # run level that starts revealing dungeon entrances
shifter_dungeon_radius_base = 45.0  # world-units at which an entrance shows itself
shifter_dungeon_radius_per_level = 3.0
shifter_item_sense_at = 2           # run level to tell insured loot from ephemeral
# Trap sense: a Runner reads a dungeon's rigged cells before anyone stands on one.
# Radius is in dungeon CELLS, and only armed traps are ever revealed — a disarmed
# one is furniture. Without this the Shifter's whole disarm advantage only mattered
# after someone had already found the trap the hard way.
shifter_trap_sense_at = 1
shifter_trap_radius_base = 4.0
shifter_trap_radius_per_level = 0.15
# Psyker — TELEKINESIS, the one thing the order does that nobody else can. Tapping a
# creature pins it where it stands: it stops moving, chasing and skirmishing, but it stays
# touchable, and a fight begun against a pinned creature opens with the whole party's
# gauges FULL. That is the decision the perk is FOR — you chose the moment, so you get the
# first move. Seeing belongs to the Hunter and the map to the Explorer, so the Psyker's is
# a verb. Held on a cooldown rather than a cost: a pin you can spam walks past all content.
psyker_hold_at = 1                # run level at which the pin is earned
# The numbers answer one question: can a Psyker keep everything it can reach pinned
# FOREVER? To sustain N pins you must lay one every `seconds / N`, so the cooldown has to
# stay above that or the deep game is a Psyker walking through content untouched. At the
# caps: 12s / 3 targets = one needed every 4s against an 8s cooldown, so ~1 creature can be
# held indefinitely, or all 3 in a burst that then lapses. A test holds this at EVERY level,
# not just the caps — the first draft passed at level 1 and failed at 255.
psyker_hold_seconds_base = 4.0    # how long one pin holds at unlock
psyker_hold_seconds_per_level = 0.05
psyker_hold_seconds_cap = 12.0
psyker_hold_cooldown_base = 14.0  # seconds between pins at unlock…
psyker_hold_cooldown_per_level = 0.03   # …shortening with level…
psyker_hold_cooldown_floor = 8.0        # …but never past the sustain line above
psyker_hold_targets_at = 25       # run level at which a second creature can be pinned
psyker_hold_targets_per_level = 60
psyker_hold_targets_cap = 3
psyker_hold_radius = 26.0         # world-units a Psyker can reach to pin
# Mind Link: co-op teammates ride your snapshot however far off they are. POSITIONS only —
# the map itself is the Explorer's, so this says "where they are", never "what they see".
psyker_mind_link_at = 10
# Resonant — walking regen (HP/sec per run level), and it tends ONLY the Resonant
# itself. Poured over the whole party it healed away the wounds between fights, so a
# party carrying a healer never needed healing and the class's own kit went unused. A
# still's field (`[forge] alembic_regen_per_sec`) is what mends everyone — that one is a
# PLACE you choose to stand, not a passive you get for bringing someone.
resonant_regen_per_level = 0.4
# Phoenix Guard — bulwark: creature aggro/skirmish radius shrinks per run level.
# THE ORDER OF THE IRON HULL, on the overworld. Two perks, and both are the order's own
# etiquette rather than new machinery: the Resonant Wake is a standing deterrent (the same
# shape as the Phoenix Guard's bulwark — a party may hold both orders, and the server takes
# the stronger), and Hull-Listening is Gloop's ear against the wood. [TUNABLE]
iron_hull_wake_at = 1                  # run level the deterrent starts working
iron_hull_wake_reduction_per_level = 0.03  # …shrinking the chase radius this much a level
iron_hull_wake_mult_floor = 0.5        # …never to nothing; a monk is not invisible
iron_hull_listen_at = 2                # run level that starts feeling creatures through the ground
iron_hull_listen_radius_base = 24.0
iron_hull_listen_radius_per_level = 1.8

# THE WALL DEFENSE FORCE, on the overworld. Recall Blade reaches for loot instead of a
# weapon, and Inertial Nullification turns every cliff into a route DOWN. [TUNABLE]
rift_knight_recall_at = 1              # run level at which loose loot comes to your hand…
rift_knight_recall_radius_base = 9.0   # …from this far
rift_knight_recall_radius_per_level = 0.9
rift_knight_drop_at = 3                # run level at which a terrace may be stepped off anywhere
phoenix_guard_aggro_reduction_per_level = 0.04
phoenix_guard_aggro_mult_floor = 0.4   # mobs never fully ignore an Phoenix Guard party
phoenix_guard_trample_radius = 0.0     # stretch: trample obstacles this small (0 = off)
# THE TWO PROFESSION CLASSES had no overworld perk at all — every other class earns one,
# and the pair whose whole identity is what they do BETWEEN fights earned nothing for
# walking around. These are that half of the kit (MS-1's second ladder): a Smithwright
# makes the party's benches cheap and long-lived, a Keeper makes the ground give more.
#
# Smithwright — the Foundry reads the rock, and sets up faster than anyone.
smithwright_ore_sense_at = 1        # run level that starts revealing ORE veins at range
smithwright_ore_radius_base = 26.0  # world-units at which a vein shows itself
smithwright_ore_radius_per_level = 2.0
smithwright_setup_at = 2            # run level at which benches go up quicker and cheaper
smithwright_setup_mult = 0.6        # station_setup_ms x this
smithwright_stock_discount = 1      # ore knocked off what a bench costs to raise
smithwright_pack_full_at = 4        # run level at which packing up returns the WHOLE stock
smithwright_bench_uses_at = 8       # run level at which its benches serve extra jobs…
smithwright_bench_uses_bonus = 2    # …this many more
# Keeper — the Open Flower reads the ground, and takes more from it without killing it.
keeper_reagent_sense_at = 1         # run level that starts revealing REAGENT beds at range
keeper_reagent_radius_base = 26.0
keeper_reagent_radius_per_level = 2.0
keeper_green_thumb_at = 2           # run level at which a tick sometimes yields two…
keeper_green_thumb_chance = 0.25    # …this often
keeper_rooted_at = 4                # run level at which the alembic's field grows…
keeper_rooted_radius_mult = 1.6     # …this much wider…
keeper_rooted_regen_mult = 1.5      # …and this much stronger
keeper_whole_vein_at = 8            # run level at which a unit sometimes costs the node nothing
keeper_whole_vein_chance = 0.2

