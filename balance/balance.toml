# keeps the party moving and standing. No Adrenaline — nothing here has a resource
# cost, so the multipliers sit below the Hunter's paid strikes. [TUNABLE]
explorer_trailblaze_mult = 1.15
# TRAILBLAZE MARKS ITS TARGET. The Explorers' whole brief is that nobody accomplishes it
# alone (docs/lore/factions.md), so the order's opener is not a bigger hit — it is the hit
# that makes everyone else's better. A blazed creature takes more from EVERY ally for a
# window, which is what makes the L1 button worth pressing over a plain Attack. [TUNABLE]
explorer_mark_damage_mult = 1.2   # damage taken by a blazed target, from anyone
explorer_mark_ticks = 60          # ~6s at the 100ms tick — the party has to follow the trail
# Field Dressing (Traveler, L2): a modest self/ally heal as a fraction of max HP.
explorer_field_dressing_fraction = 0.12
# Read the Ground (Scout, L5): damage plus an ATB-gauge steal.
explorer_read_ground_mult = 1.1
explorer_read_ground_drain = 0.5
# MISDIRECTION (was Read the Ground): the creature is DISTRACTED. A dazzled foe swings wide — the
# bonus is added to whoever it attacks — and a party that cannot be pinned down can leave,
# so it lifts the flee chance too. Blind/dazzle in other games; here it is the mapping
# order making a creature lose the thread. [TUNABLE]
explorer_misdirection_miss = 0.3      # added to the defender's dodge while the attacker is dazzled
