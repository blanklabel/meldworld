# THE ORDER OF THE IRON HULL's monk: an UNARMOURED, UNARMED fighter that survives by not
# being hit. The Phoenix Guard is a WALL — plate, the most HP in the game, no dodge at all —
# so this order is built as its opposite rather than as a second one, and the stat line is
# where that is decided rather than in flavour text.
#
# ⚠️ `dex` MUST CLEAR `[attributes] dodge_dex_floor` (10) OR THE CLASS HAS NO DODGE AT ALL.
# It was first written at exactly 10, which is the floor — every point of the "rides a blow
# rather than eating it" design evaluated to zero, silently, because the floor is a `<=`.
# A dodge class whose Dex sits on the floor is a squishy class with nothing to show for it.
# 13 clears it and `dex_per_level` grows it; it stays under the Shifter's 16 because the
# Runner is the dodge class and this is a monk that also punches.
#
# It pays for that in the two things it has given up: no armour (Light/Robe only) and no
# weapon (it fights with bound hands), so `base_def` and `base_hp` sit well under the
# Guard's 6/52 — above the Shifter's 2/32, because it still holds a front line.
#
# The `base_ward` above every other martial class is its own doctrine: both capstones are
# ACOUSTIC, which routes through `ward` rather than `def`, and an order that deafens things
# for a living should not be deaf to the same trick. [TUNABLE]
[player.iron_hull]
base_hp = 42
base_atk = 13
base_def = 3
base_ward = 2
speed_stat = 92
str = 13
mnd = 7
dex = 13
wll = 10
str_per_level = 2
mnd_per_level = 1
dex_per_level = 3
wll_per_level = 2

