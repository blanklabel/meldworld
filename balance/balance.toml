# The distance at which each biome starts appearing in a RANDOMIZED run (the tutorial
# keeps its own hand-tuned Forest-first bands). Difficulty is distance-driven, but a
# biome's creature ROSTER is not interchangeable: measured against a level-1 solo at
# the shallow ring, forest won 11/15 while desert and tundra won 0/15 — their rosters
# lead with armoured bruisers. Gating the harsher themes outward is what makes the
# first ring an on-ramp without flattening the creatures themselves. Keyed by biome
# id; a biome missing here is available from the hub. [TUNABLE]
[biome_gate]
field = 0
forest = 0
mire = 0
ashfall = 250
desert = 400
tundra = 550

# THE HUNT BOARD (AD-4): what the board pays for a completed hunt. A hunt is a
# directed goal, not a grind loop — each one is claimable ONCE, so these are one-off
# payouts sized against several kills at the hunt's own band rather than an income.
# The reward scales off the hunt's tier (docs/proposals/adventure-depth.md §E);
# chits minted here are economy source S4 (docs/behaviors/economy.md). [TUNABLE]
[hunt]
reward_chits_base = 200          # what a tier-0 (shallow wood) hunt pays
reward_chits_growth_per_tier = 1.8   # each band deeper is worth this much more
reward_material_qty = 2          # stacks handed over with the chits at tier 0…
reward_material_qty_per_tier = 1 # …plus this per band, so a deep hunt seeds a deep craft
# Tracking a quarry. A posted hunt tells you WHAT you are looking for, so anyone holding
# one senses its quarry a little past the interest radius; a Hunter senses it much
# further, which is the guild's whole trade. Force-included into that player's own
# snapshot (never a wider shared cull). [TUNABLE]
quarry_sense_radius = 36.0
quarry_sense_hunter_radius = 90.0

# BOUNTIES (AD-4): the Den's generated contracts. Each one is a named boss standing in the
# world for ONE player, rolled against that player's HUNTER RANK — a persistent track (the
# `hunting` Meld skill) that only board work raises, so the ladder is "how many marks have
# you put down", not "what level is your party". Contracts expire and re-roll, so the list
# is always live. [TUNABLE]
[bounty]
active_slots = 3                 # standing contracts at once; finishing one draws another
window_hours = 20                # how long a contract stands before it is withdrawn
rank_xp_base = 90                # hunter XP a rank-0 contract banks…
rank_xp_per_rank = 22            # …plus this per rank, so the ladder keeps its pace
# Where a mark is sighted: shallow at first, deeper as the Den trusts you with worse.
sighting_base_distance = 140
sighting_per_rank = 95
sighting_jitter = 0.25           # +/- fraction on the sighted distance
# What a mark IS. Power multiplies a standard creature at that depth — a Gatekeeper is
# 10x, so an early mark is a real fight and a deep one is worse than the door.
power_base = 3.2
power_per_rank = 0.55
dungeon_chance = 0.35            # fraction of contracts that wait at the bottom of a descent
# What it pays. Chits scale with rank; the material is the sighting band's own trophy.
reward_chits_base = 320
reward_chits_per_rank = 145
reward_material_qty = 2
reward_material_qty_per_rank = 1
reward_gear_from_rank = 2        # rank at which contracts start paying a rolled piece

# =============================================================================
# The Shifting Lands (CANON D20 / §W2) and the persistent world (§W1/§W5).
#
# A world no longer dies when the last diver leaves — it is a place, and it is
# still there when you come back. That makes churn structural rather than
# cosmetic: a world nobody ever refreshed would be a strip mine within an hour.
# The Shift is that churn. Regions periodically swap biome, taking Force damage
# to whatever stands in them and wiping their creatures + collectables; what
# grows back belongs to the NEW biome.
#
# The scheduler is a pure function of `(world_seed, shift_generation)` driven by
# the server TICK COUNTER — never wall-clock (CANON §W2) — so a world's whole
# Shift history is replayable from two integers and persistence stays cheap.
# =============================================================================
[shift]
# Cadence: ticks between one Shift landing and the next being scheduled, jittered
# ±`cadence_jitter` off the seed. At `tick_ms = 100` these are 3–7 minutes.
cadence_ticks = 12000            # ~20 min at the shipped 100 ms tick. Long enough that a
                                 # Shift is an event you remember rather than weather you
                                 # stop reading; short enough that a region you stripped is
                                 # refreshed within a session.
cadence_jitter = 0.4             # ± fraction, drawn per generation from the seed
# The tell. A region announces itself before it goes: the sky turns, and you have
# this long to walk out of it. Short enough to be a scramble, long enough to be a
# decision — a Shift you cannot escape is a dice roll, not a hazard.
warning_ticks = 100              # 10 s at the shipped tick
# Size (CANON's 1d6 Tiny…Cataclysmic): how many CONTIGUOUS sections retile at once.
# A section is a radius ring in the WG-4 fan, so this is the game's translation of
# the tabletop size table — the client already keys ground + biome off per-section
# rings, so a section-granular Shift retiles for free.
min_sections = 1
max_sections = 3
# Force damage dealt to every avatar caught inside when it lands, as a fraction of
# that hero's OWN max HP — a hero runs 40 max HP at level 1 and ~535 at 100, so a
# flat number is a death sentence early and a rounding error late (the
# every-magnitude-is-a-fraction rule). Scales with the region's size, so a
# Cataclysmic swap is the one that kills you.
damage_fraction_min = 0.18       # a Tiny (1-section) Shift
damage_fraction_max = 0.45       # the largest one this world rolls
# Never inside this radius of the hub. The doorstep has to be somewhere a new
# player can stand and read the game; a Shift on the tutorial ring is a wipe
# before anyone has learned what the warning means.
safe_radius = 60.0
# Weighting: a region nobody has walked through in a while is the more interesting
# one to churn, but a purely LRU pick makes the Shift predictable ("it always hits
# where you aren't"). This is the share of picks that are uniform-random instead.
random_pick_share = 0.5

[world_persist]
# A world is a place. It is not torn down when the last diver leaves (CANON §W1),
# it keeps ticking, and its delta from the seed baseline is written to Postgres so
# it survives a restart (§W5). Only a TUTORIAL world stays ephemeral — the guided
# first dive is onboarding, not a world.
enabled = true
# How often the world's delta is flushed to Postgres, in ticks. The baseline is
# regenerated from the seed and never stored, so a flush is small.
save_every_ticks = 600           # once a minute at the shipped tick
# Regrowth. The Shift is the headline churn, but a region can go a long while
# without one, and a persistent world whose first three sections are permanently
# stripped is worse than an ephemeral one. A felled creature's slot refills and a
# spent node re-stocks after this long — long enough that clearing ground means
# something, short enough that coming back tomorrow finds a world.
creature_regrow_ticks = 1800     # 3 min at the shipped tick
node_regrow_ticks = 3000         # 5 min — ore is slower to come back than a fight
chest_regrow_ticks = 18000       # 30 min: treasure is the one thing farming must not print

# =============================================================================
# Player-built structures (CANON D21 / §W3) — one primitive, many functions.
# The registry of functions is `meld_proto::structures`; these are its magnitudes.
#
# The loop these numbers have to serve (BD-3): an anchor HOLDS its region against the
# Shift, and every Shift it holds off COSTS it. So an anchor is not permanence you buy
# once — it is permanence you keep paying for, and the payment is repair material hauled
# out to it. Tune `shift_hold_damage_fraction` against `anchor_max_hp` and you are
# deciding how many Shifts an unattended anchor survives.
# =============================================================================
[building]
# Everything is built from ORE you are carrying. Wood and stone are BD-1's job; using the
# material that already exists keeps this playable now rather than gated on a harvest
# rework, and it makes deep ore a structural sink as well as a crafting one.
anchor_ore_cost = 6
wall_ore_cost = 2
anchor_max_hp = 900
wall_max_hp = 400
# Time from placement to full HP. A structure goes up at `build_start_fraction` of its
# HP and ramps — so planting one in front of an oncoming Shift is a gamble on whether it
# finishes, which is the decision the build timer exists to create.
anchor_build_ms = 20000
wall_build_ms = 6000
build_start_fraction = 0.15
# How far an anchor's hold reaches, in world units. Wider than a section is deliberate:
# the Shift is section-granular, so a pin narrower than a section could never hold a
# whole one and the loop would never fire.
anchor_pin_radius = 90.0
# Repair: one unit of ore buys this much HP back. The counter to attrition, and the
# reason a held region needs supply rather than just a builder.
repair_hp_per_ore = 120
# Packing one up hands back a share of what it cost — anti-grief and anti-clutter, never
# a full refund, or moving one is free.
demolish_refund_fraction = 0.5
# No two structures inside this of each other, so a wall is a wall and not a hedge of
# three hundred overlapping ones.
min_spacing = 6.0
# No blocking structure may go up this close to ANOTHER player. The spacing rule above
# already guarantees a ring of walls has a gap you can walk through, but that is a promise
# about geometry — it says nothing about penning somebody in one block at a time while
# they stand still, and a player cannot demolish what somebody else built around them.
# Only blockers are gated: an anchor is not a cage.
no_build_near_player = 8.0
# Per player, per world. A cap rather than a cost curve because the interesting decision
# is WHERE, and an unbounded builder is a performance question rather than a design one.
max_per_player = 12
# How often the world checks whether anyone is standing inside something impassable and
# walks them out (`Arena::rescue_trapped`). A cadence rather than every tick: being stuck
# for a tenth of a second is nothing, and being stuck forever means closing the game.
stuck_check_ticks = 10
# What one held-off Shift takes out of every anchor holding it, as a share of that
# anchor's max HP. This is the whole of `BD-3`'s tension: the land pushes back, and an
# anchor nobody maintains falls on its own. Sized so an unattended anchor holds roughly
# four Shifts before it goes.
shift_hold_damage_fraction = 0.25
