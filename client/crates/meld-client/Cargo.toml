[package]
name = "meld-client"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Bevy client: overworld + ATB battle UI for the core gameplay loop (T4+T5)."
# The crate ships two binaries (the game + the `smoke` test harness); name the
# game as the default so a bare `cargo run -p meld-client` (e.g. from serve.sh /
# `make play-native`) is unambiguous.
default-run = "meld-client"

[dependencies]
# `webp` decodes the login screen's baked backdrop frames. It is NOT `jpeg`
# because every zune-jpeg 0.5.x fails to build on the current rustc.
bevy = { version = "0.16", features = ["mp3", "webp"] }
# Networking: ewebsock for the
# realtime WebSocket, ehttp for the auth HTTP calls. Both are poll/callback based
# and need no tokio, which keeps the client off the server's async stack.
ewebsock = "0.6"
ehttp = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
meld-proto = { path = "../../../shared/meld-proto" }

# Extras for the `embedded-server` build. Optional, so a normal
# `cargo build -p meld-client` never compiles the server stack. Paths reach into the
# server workspace exactly like meld-proto does.
meld-server = { path = "../../../server/crates/meld-server", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }
bevy_embedded_assets = { version = "0.13", optional = true }
# Raise the process's open-file limit at startup — Bevy's asset loader opens many
# files at once and a low soft limit (256 on a GUI/launchd-launched macOS process)
# makes loads fail with "Too many open files", silently dropping sprites + models.
rlimit = "0.10"

[features]
# Bake every game asset into the binary (via bevy_embedded_assets) instead of
# loading loose files from disk. Used by `make play` for a robust, representative
# run (no disk `assets/` folder, no file-descriptor storms) — but WITHOUT embedding
# the server, so it still talks to a real `MELD_SERVER` (Postgres-backed). Native
# only. `make play-dev` leaves this OFF so assets hot-reload from disk.
embedded-assets = ["dep:bevy_embedded_assets"]

# The self-contained QA / demo build. Implies `embedded-assets`, and additionally
# boots the whole server in-process on a background thread (in-memory DB, embedded
# balance — no Postgres, no separate server), so it runs as ONE file with nothing
# beside it.
embedded-server = ["embedded-assets", "dep:meld-server", "dep:tokio"]


[dev-dependencies]
# Reading the bundled face in tests, so "is this glyph real?" is checked rather than
# verified by hand once. Bevy's text stack already pulls it in.
ttf-parser = "0.21"
