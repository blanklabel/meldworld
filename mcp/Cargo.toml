[package]
name = "meld-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The game as a set of tools: an MCP server that boots MELDWORLD in-process and plays it over the real wire."

[[bin]]
name = "meld-mcp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde_json.workspace = true
futures-util.workspace = true
uuid.workspace = true
axum = { workspace = true }
tracing-subscriber.workspace = true
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

meld-proto.workspace = true
meld-balance.workspace = true
meld-db.workspace = true
meld-server.workspace = true
