# Build + lint + test on every PR and every push to main.
#
# This runs `make check` and nothing else, deliberately: the same command a developer runs
# locally is the command that gates a merge, so the two cannot drift. Adding a check means
# editing the Makefile, not this file.
#
# What it covers, and why it is worth a job at all: the Bevy client is a SEPARATE cargo
# workspace (sharing only `meld-proto` by path), so `cargo test --workspace` at the repo root
# never touches it. A variant added to a shared enum can pass every server-side check and
# still leave the game unbuildable — `ConsumableEffect::ThrownAll` did exactly that, and
# `main` could not build the client for several merges before anyone tried it.
#
# The Postgres-backed `qa/` suite is NOT here. It drives real bot clients through real-time
# loops with wall-clock deadlines, and those flake under a loaded shared runner — a suite that
# goes red on its own would train everyone to ignore the light. `make check` still COMPILES
# those tests (clippy --all-targets), so a broken one fails here; running them is `make test`.
name: check

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to a PR makes the in-flight run pointless, so drop it rather than pay for it.
# `main` is exempt: those runs say whether a merged commit is good and must not be cancelled.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Both workspaces from cold, including Bevy, plus the server suite — which is the
    # half that grows. `meld-world` alone is ~16 min locally and most of its tests sweep
    # every biome and every seed, so widening the world widens them: going from six
    # biomes to eleven took the local suite 831s -> 949s and pushed this job past 45,
    # where it was killed mid-run with everything passing.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # Bevy's Linux build needs ALSA + udev dev headers to COMPILE (X11 is dlopen'd at
      # runtime, so no dev lib is needed just to build). Same list as the dist workflow.
      #
      # ⚠️ WAYLAND IS NOT dlopen'd THE WAY X11 IS. `wayland-sys` resolves `wayland-client`
      # through pkg-config in its BUILD SCRIPT, so without the dev package the client
      # workspace cannot compile at all — "Package 'wayland-client' ... not found", ~48
      # minutes into a cold build. It reads as a slow, mysterious CI failure rather than a
      # missing apt line, and it had already been failing on `main` for days.
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # BOTH target dirs — they are separate workspaces with separate locks, and the client's
      # is the expensive one (Bevy). `.` must be listed explicitly once `client` is.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            client

      - run: make check
